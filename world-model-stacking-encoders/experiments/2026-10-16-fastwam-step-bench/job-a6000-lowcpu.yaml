# v5 (A6000, low CPU/mem): earlier A6000/L40/A40 attempts never scheduled. Prometheus showed free A6000s only on
# nodes with ~1 CPU / little RAM left, so this asks for 1 CPU / 16Gi and the script builds the model on the GPU.
# Single-GPU timing/memory benchmark of one Fast-WAM training step (random weights, synthetic LIBERO-shaped input).
# Follows _standards/08: Job (not pod), runs a real command and exits, NO sleep, 1 GPU, limits within 20% of requests,
# activeDeadlineSeconds caps runtime so a hang can't hold an idle GPU.
# Bench script is mounted from ConfigMap `stacking-encoders-bench-src` (created from ../../src/bench_fastwam_step.py).
apiVersion: batch/v1
kind: Job
metadata:
  name: stacking-encoders-fastwam-step-bench-a6000-lowcpu
  namespace: aria-world
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 10800        # 3 h hard cap (includes time Pending)
  ttlSecondsAfterFinished: 86400      # safety net; delete manually after collecting logs
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: nvidia.com/cuda.driver.major, operator: Gt, values: ["569"]}   # CUDA 12.8 image needs driver >= 570
      containers:
      - name: main
        image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          nvidia-smi
          mkdir -p /work && cd /work
          python - <<'PY'
          import io, os, urllib.request, zipfile
          url = "https://github.com/yuantianyuan01/FastWAM/archive/%s.zip" % os.environ["FASTWAM_COMMIT"]
          zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(url).read())).extractall("/work")
          PY
          mv /work/FastWAM-${FASTWAM_COMMIT} /work/FastWAM
          pip install --no-cache-dir -q \
            accelerate==1.12.0 einops==0.8.1 hydra-core==1.3.2 omegaconf==2.3.0 \
            huggingface-hub==0.29.2 modelscope==1.34.0 safetensors==0.5.3 transformers==4.49.0 \
            regex==2025.11.3 rich==14.2.0 termcolor==2.5.0 imageio==2.37.0 imageio-ffmpeg==0.6.0 \
            boto3==1.35.99 numpy==2.2.6 typing-extensions==4.15.0 ftfy
          echo "=== pip freeze"; pip freeze
          cd /work/FastWAM
          for CK in false true; do
            echo "=== bench grad_checkpointing=${CK}"
            python /bench/bench_fastwam_step.py --fastwam-root /work/FastWAM --ckpt ${CK} --batches 1 2 4 8 16 \
              || echo "=== bench grad_checkpointing=${CK} FAILED (exit $?)"
          done
          echo "=== done"
        env:
        - {name: FASTWAM_COMMIT, value: 7faa71108368fbb3b6885649f112af607427a2d4}
        - {name: PYTHONPATH, value: /work/FastWAM/src}
        - {name: DIFFSYNTH_MODEL_BASE_PATH, value: /work/checkpoints}
        - {name: MODELSCOPE_CACHE, value: /work/ms-cache}
        - {name: HF_HOME, value: /work/hf}
        - {name: MPLBACKEND, value: Agg}
        - {name: PYTHONUNBUFFERED, value: "1"}
        resources:                    # limits within 20% of requests
          requests: {cpu: "1", memory: 16Gi, nvidia.com/rtxa6000: "1", ephemeral-storage: 20Gi}
          limits:   {cpu: "1", memory: 19Gi, nvidia.com/rtxa6000: "1", ephemeral-storage: 24Gi}
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: bench-src, mountPath: /bench, readOnly: true}
      volumes:
      - name: work
        emptyDir: {sizeLimit: 24Gi}
      - name: bench-src
        configMap: {name: stacking-encoders-bench-src}
