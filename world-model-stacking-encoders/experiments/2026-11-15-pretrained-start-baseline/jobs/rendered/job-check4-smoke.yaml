# NOT SUBMITTED (written 2026-11-15, Mac only; no kubectl run, no dry run). Prepared only; the lead submits it after the user's go in
# the lead's window, and ONLY AFTER jobs/job-check4-train.yaml succeeded (its model.pt is the input), following jobs/RUN-check4.md.
# Fill SRC_GIT_COMMIT at submit (RUN-check4.md step 15: the render replaces only the env value line); the pod aborts (exit 10)
# unless it is a 40-hex commit.
# IMPLEMENTS: PLAN "Sanity checks before the full run" item 4, second half: "a timed smoke evaluation of 40 rollouts, one per clean
#   task", timing-only (item 4.3: every init state of every clean task is used by the final evaluation, so the smoke must not
#   produce test outcomes; the amendment 2026-11-15 later records that every clean base task holds exactly 50 init states,
#   fastwam-reading.md section 6 line 131, verified there, so "--clean 50" uses all of them and the timing-only branch applies),
#   on Nautilus L4 only (PLAN "Evaluation on clean LIBERO" and "Parameters set from measurements": evaluation starts on L4, leaving
#   L4 is the user's call). It records each rollout's wall time (rollout.py run_episode, wall_s), the GPU use over --monitor-s
#   windows, pod CPU and memory (rollout.py monitor_resources), for "Evaluation time" and for setting shards, environments per
#   pod and the deadline of the 2,000-rollout evaluation.
# What it runs: python /src/rollout.py run --timing-only --clean 1 ... (rollout.py subcommand "run", line 741; the lead's text called it
#   "rollout"; no such subcommand exists). --clean 1 = 1 trial per task x 40 clean tasks = 40 jobs (make_jobs, line 125),
#   trial 0 = init state 0, eval seed 41 (--clean-seed default). --timing-only (line 758): done signal ignored, every episode
#   runs to its step limit (430 env steps in spatial/object/goal, 730 in libero_10), records and log lines hold no success, no
#   step count at success and no final state (run_episode line 377, record line 551). Resume guard: a timing-only run
#   refuses an --out holding normal rows, and rows of another run are refused (check_resume, done_keys). Records go to
#   /mnt/proxy/rollouts/baseline-check4/<smoke>.jsonl, a new file in a new folder, never the final evaluation's (PLAN 4.4).
#   This is a test-task use (_standards/07 line 6) and is logged as one; the smoke's outcomes are not computed.
# INPUTS (paths and where each is documented):
#   --run-dir /mnt/proxy/runs/baseline-check4-none-s0-try$TRAIN_TRY : the training Job's --out; Policy.load reads <run-dir>/model.pt
#     (rollout.py lines 293-296); model.pt is written there by pretrained_train.py (line 550-552). The pod aborts (exit 15) if absent.
#   --t5 /mnt/proxy/feats/t5 : jobs/job-rollout.template.yaml line 50 ("--t5 $R/feats/t5" in the proxy's rollout Jobs, e.g.
#     experiments/2026-10-27-proxy-calibration/jobs/rendered/job-eval-dinov3-s1-l4.yaml line 92-93), data/README.md section 4b line 75
#     (1,549 unique prompts). The 40 clean instructions are in it: rollout.py "instructions" writes the clean base languages into the
#     list the cache was built from (rollout.py line 784), and its --meta check asserts the clean instructions equal the
#     training instructions (job-sim.yaml line 55: the run used --meta when the training meta existed; LOG line 643).
#   --vae-path /mnt/proxy/models/Wan2.2_VAE.safetensors : job-rollout.template.yaml line 50 / job-eval-dinov3-s1-l4.yaml line 93; written by
#     jobs/job-download.yaml line 56 (sha256 0e913a2c...). Featurizer loads it with extract_fastwam.load_vae (rollout.py line 217).
#   --tasks /mnt/proxy/lp_tasks.json : the clean task list (key "clean": 10 base tasks per suite, 40 in all; rollout.py main() reads
#     ["clean"]). Written by jobs/job-sim.yaml line 56 (--tasks-out $R/lp_tasks.json), used by every proxy rollout Job
#     (template line 50, job-eval-dinov3-s1-l4.yaml line 93), checked for 40 clean tasks by jobs/rendered/job-rollout-precheck.yaml line 51.
#   Env bundle: /mnt/proxy/env/env-9182f8131559.tar, restored by "/src/env_bundle.sh restore" (job-eval-dinov3-s1-l4.yaml line 88): proxy LOG
#     line 55 records the bundle, built by env-build4. Its key = sha256(setup_env.sh + setup_sim.sh + env_bundle.sh)[0:12]
#     (env_bundle.sh line 16); on main at 85da306 that is 9182f8131559 (computed on the Mac, cat of the three files | shasum -a 256), so the
#     ConfigMap MUST hold those three files unchanged or the restore fails ("no env bundle ..."). It also needs LIBERO-Plus assets
#     /mnt/proxy/sim/assets.zip (setup_sim.sh line 14; written by job-sim.yaml lines 44-51).
# CONFIGMAP: a NEW one, stacking-encoders-baseline-eval-src, 11 keys: the import chain of rollout.py: rollout.py (imports lp_eval,
#   proxy_wam; extract_fastwam, extract_features and fastwam_data imported in Featurizer, rollout.py lines 217, 218, 226, i.e. also for
#   config none; libero from the sim bundle), lp_eval.py (numpy only), proxy_wam.py (imports t5_cache, diagnostics, fastwam), t5_cache.py, diagnostics.py,
#   extract_fastwam.py (imports fastwam_data, diagnostics), extract_features.py (imported for ENCODERS even for config none, rollout.py line 218;
#   module imports h5py, torch only; heavy encoder imports are inside functions), fastwam_data.py;
#   plus setup_env.sh, setup_sim.sh, env_bundle.sh for the restore. Not stacking-encoders-baseline-src (7 keys, no rollout.py, no
#   setup_sim.sh or env_bundle.sh) and not stacking-encoders-proxy-src (14 keys, its rollout.py predates --timing-only; other Jobs mount it).
#   Adding keys to baseline-src is an option instead (RUN-check4.md step 3, the Option).
# CHOICES TO CONFIRM (the lead decides):
#   --envs: starts at 4, the proxy's value (job-eval-dinov3-s1-l4.yaml line 94, "--envs 4 --cuda-graph"; L4 pods averaged about 50%
#     over a run, proxy PLAN line 260). Env var ENVS. The PLAN's rule is to raise environments per GPU until GPU use is at or above
#     40% over 10-minute windows (PLAN "Parameters set from measurements"). One pass only (the user dropped a second
#     in-pod pass): if the GPU is under 40% over 10-minute windows, the lead brings it to the user for a separate smoke Job at more
#     environments. The pod has 4 CPUs, as the proxy's, so more than 4 environments may not raise GPU use (rollouts are CPU-bound,
#     proxy PLAN line 260).
#   --cuda-graph: on, as every proxy rollout Job. Whether capture works and fits at this model size is unmeasured (PLAN "Evaluation on
#     clean LIBERO"); if capture fails the run errors out (exit 1), and the fallback (no --cuda-graph) is a re-render with CUDA_GRAPH "0".
#   --monitor-s 600: the 10-minute windows (rollout.py line 764, default 600). A pod may finish in fewer than 600 s of rollouts; the pod
#     also samples nvidia-smi every 30 s into the log and a CSV, with a per-phase mean at the end, so some GPU figure exists either way.
# GPU use / 40% rule (STANDARDS.md line 48): setup (restore, about 7 to 9 min, GPU idle: proxy LOG lines 55 and 78) and the model
#   load (single reader from CephFS, up to about 4 min at 30 MB/s, unmeasured) precede the rollouts; pod age under 30 min is skipped
#   by NRP's portal and the pod ends well under 180 min (_standards/08), and the mean is logged. Measuring it is the point of this Job.
# Time estimate (speculative; there is no measurement for this model): restore about 9 min (proxy LOG line 55: untar 41 s + 487 s;
#   line 78: 91 s + 340 s), model load up to 4 min (6.7 GB at 30 MB/s, 223 s; rollout.py loads with torch.load map_location cpu,
#   then builds on the GPU), then the rollouts. Sim cost alone is about 20,200 env steps (30 tasks x 430 + 10 libero_10 x 730) at
#   the proxy's measured throughput of 484 episodes per hour at 4 envs (proxy PLAN line 166), about 5 min for 40 episodes. Policy
#   cost for a 53x larger model (PLAN "Evaluation time"): about 2,000 policy calls (20,200 steps / replan 10), batched up to 4;
#   at a guessed 0.3 to 1 s per batched call on an L4 that is 2.5 to 33 min of GPU time. So rollouts about 10 to 40 min, and the
#   pod about 25 to 55 min in all, GPU-hours about 0.4 to 0.9.
# Deadlines: pod-level activeDeadlineSeconds 7800 s (130 min, from pod start) = about 9 min restore (540 s) + model load (up to 240 s) + 5400 s
#   rollout cap = 6,180 s, rounded up with margin to 7,800 s (130 min), under NRP's 180-minute runtime paths (_standards/08); inner `timeout`s: none on the restore (it is
#   sourced so it cannot be wrapped; measured 7 to 9 min; the pod deadline caps it), each rollout pass 5400 s (a worst-case guess of 3 s per unbatched policy call x 2,000 calls = 100 min is NOT covered; if the
#   pass times out the records written so far are in the file and the pod ends with 124). Job-level 79200 s = 2 x 55 min (1.83 h) +
#   20 h of queue = 21.83 h, rounded to 22 h (the rule 2 x run + 20 h of job-sanity.yaml's header; the L4 queue is usually shorter than
#   the L40's, speculative). ttl 24 h.
# Sizing (each number's source; requests and limits within 20%): the proxy's L4 rollout Jobs' values, job-eval-dinov3-s1-l4.yaml lines
#   113-114 and 123 and 131: GPU 1 (NVIDIA-L4, driver > 569, us-west, the two host exclusions: lines 68-73); CPU 4 / 4800m; memory 28Gi / 33Gi
#   (the proxy's peak working set was 16.4 GB with a 0.5 GB drift, that file's header, plus the 6.3 GiB fp32 model.pt held on the host once
#   by torch.load = about 23 GB, under 28Gi = 30 GB; speculative); ephemeral 50Gi / 58Gi and /work sizeLimit 58Gi (pip/venv bundle,
#   LIBERO-Plus and its unzipped assets; model.pt is read from the PVC, not staged); /dev/shm 4Gi. GPU memory: the model in fp32 is 6.26 GiB
#   (1,681,051,847 params x 4 B) plus the VAE, CUDA-graph pools and batch 4 activations, against the L4's 24 GB (speculative; if it runs out,
#   exit 1 with "out of memory": that is a stop for the user, PLAN "Parameters set from measurements").
#   Differences from the proxy rollout manifest: no HF_TOKEN secret (config none loads only the Wan VAE from a local file; no
#   Hugging Face download, so the secret is not mounted), no Indexed completion (one pod), new ConfigMap, --timing-only, a PVC guard,
#   a GPU sampler with phases, the records printed into the log.
# Follows _standards/08: Job, a real command that exits, no sleep, 1 GPU, limits within 20%, no tolerations, backoffLimit 0 (a failed
#   pod ends the Job; the proxy's 4 retries resumed from the JSONL, but this smoke refuses an existing records file, so a retry would
#   abort; resubmit with a new SMOKE_TRY instead).
# Exit codes: 1 python error (CUDA OOM, a simulator worker died, SystemExit from rollout.py), 10 commit not 40-hex, 11 records file exists,
#   15 model.pt missing, 124 a rollout pass timed out. Table: RUN-check4.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: stacking-encoders-baseline-check4-smoke
  namespace: aria-world
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 79200
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 7800
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-L4]
              - {key: nvidia.com/cuda.driver.major, operator: Gt, values: ["569"]}
              - {key: topology.kubernetes.io/region, operator: In, values: [us-west]}
              - {key: kubernetes.io/hostname, operator: NotIn, values: [k8s-chase-ci-07.calit2.optiputer.net, ry-gpu-08.sdsc.optiputer.net]}  # GPU faults, 2026-11-03
      containers:
      - name: main
        image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          SMI=""
          R=/mnt/proxy; TAG=baseline-check4-smoke-try$SMOKE_TRY; D=$(date +%Y%m%d-%H%M%S)
          RUN=$R/runs/baseline-check4-none-s0-try$TRAIN_TRY
          ROLL=$R/rollouts/baseline-check4
          OUT=$ROLL/smoke-try$SMOKE_TRY.jsonl
          LOG=$R/logs/$TAG-$D.log; GPUCSV=$R/logs/$TAG-gpu-$D.csv
          mkdir -p $R/logs $ROLL
          exec > >(tee -a $LOG) 2>&1
          TEE=$!
          echo "=== BASELINE SANITY CHECK 4, TIMING-ONLY SMOKE (40 clean rollouts) on $RUN -> $OUT"; date -u
          echo "SRC_GIT_COMMIT=$SRC_GIT_COMMIT SMOKE_TRY=$SMOKE_TRY TRAIN_TRY=$TRAIN_TRY ENVS=$ENVS CUDA_GRAPH=$CUDA_GRAPH"
          [[ "$SRC_GIT_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ABORT: SRC_GIT_COMMIT is not a 40-hex commit (not filled at submit?)"; exit 10; }
          if [ -e $OUT ]; then echo "ABORT: $OUT exists (an earlier smoke's records; set SMOKE_TRY to a new value)"; exit 11; fi
          [ -f $RUN/model.pt ] || { echo "ABORT: $RUN/model.pt is missing (did the training Job succeed, and is TRAIN_TRY right?)"; exit 15; }
          phase() { echo "=== PHASE $1 $(date -u +%H:%M:%S)"; echo "#phase $1" >> $GPUCSV; }
          finish() {
            rc=$?; set +e
            [ -n "$SMI" ] && { kill $SMI 2>/dev/null; wait $SMI 2>/dev/null; }
            echo "#phase end" >> $GPUCSV
            awk -F', ' 'BEGIN{p="start"} /^#phase/{p=$0; sub(/^#phase /,"",p); next} {v=$2; sub(/ %/,"",v); s[p]+=v; n[p]++; S+=v; N++} END{for(k in n) printf "[gpu-summary] %s: %d samples, mean %.1f%%\n", k, n[k], s[k]/n[k]; if(N) printf "[gpu-summary] all: %d samples, mean %.1f%%\n", N, S/N}' $GPUCSV
            echo "[cgroup] memory.peak $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a) bytes, memory.current $(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo n/a) bytes"
            for f in $OUT $OUT.errors.jsonl; do
              if [ -f $f ]; then
                echo "=== FILE $(basename $f) sha256 $(sha256sum < $f | cut -d' ' -f1) bytes $(stat -c %s $f) lines $(wc -l < $f)"
                cat $f
                echo "=== END $(basename $f)"
              fi
            done
            date -u; echo "=== exit $rc"
            exec 1>&- 2>&-; wait $TEE 2>/dev/null
            exit $rc
          }
          trap finish EXIT
          nvidia-smi; nproc; df -h $R /work
          echo "/src = ConfigMap stacking-encoders-baseline-eval-src; sha256 of its keys (must equal the commit's, RUN-check4.md step 3):"
          sha256sum /src/rollout.py /src/lp_eval.py /src/proxy_wam.py /src/t5_cache.py /src/diagnostics.py /src/extract_fastwam.py /src/extract_features.py /src/fastwam_data.py /src/setup_env.sh /src/setup_sim.sh /src/env_bundle.sh
          echo "env bundle key: $(cat /src/setup_env.sh /src/setup_sim.sh /src/env_bundle.sh | sha256sum | cut -c1-12) (the prebuilt bundle is 9182f8131559)"
          ls -la $RUN/model.pt
          : > $GPUCSV
          phase restore
          nvidia-smi --query-gpu=timestamp,utilization.gpu,memory.used --format=csv,noheader -l 30 > >(tee -a $GPUCSV | sed -u 's/^/[gpu] /') &
          SMI=$!
          . /src/env_bundle.sh restore    # as the proxy's rollout Jobs (job-eval-dinov3-s1-l4.yaml line 88); sourced, so it cannot be wrapped in `timeout`; a failure exits via set -e
          GRAPH=""; [ "$CUDA_GRAPH" = 1 ] && GRAPH="--cuda-graph"
          COMMON="--run-dir $RUN --t5 $R/feats/t5 --vae-path $R/models/Wan2.2_VAE.safetensors --tasks $R/lp_tasks.json --clean 1 --timing-only $GRAPH --monitor-s 600 --shard 0/1"
          phase rollout-envs$ENVS
          echo "FLAGS: python /src/rollout.py run $COMMON --envs $ENVS --out $OUT"
          timeout --kill-after=60 5400 python /src/rollout.py run $COMMON --envs $ENVS --out $OUT 2>&1 | sed "/using task orders/d"
          echo "=== done"
        env:
        - {name: SRC_GIT_COMMIT, value: bee6027ef928235fd1ae97d62136385ecafd3364}
        - {name: SMOKE_TRY, value: "1"}
        - {name: TRAIN_TRY, value: "1"}        # the training Job's TRY: selects /mnt/proxy/runs/baseline-check4-none-s0-try<TRAIN_TRY>
        - {name: ENVS, value: "4"}             # the proxy's value (see header)
        - {name: CUDA_GRAPH, value: "1"}
        - {name: HF_HOME, value: /work/hf}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: PYTHONPATH, value: /src}
        - {name: SIM_DIR, value: /work/sim}
        - {name: MUJOCO_GL, value: egl}
        - {name: PYOPENGL_PLATFORM, value: egl}
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility,graphics"}
        resources:                    # the proxy's L4 rollout values; limits <= 1.2x requests; sources in the header
          requests: {cpu: "4", memory: 28Gi, nvidia.com/gpu: "1", ephemeral-storage: 50Gi}
          limits:   {cpu: "4800m", memory: 33Gi, nvidia.com/gpu: "1", ephemeral-storage: 58Gi}
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: src, mountPath: /src, readOnly: true}
        - {name: proxy, mountPath: /mnt/proxy}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: work
        emptyDir: {sizeLimit: 58Gi}   # pip, LIBERO-Plus + unzipped assets (the bundle)
      - name: src
        configMap: {name: stacking-encoders-baseline-eval-src}
      - name: proxy
        persistentVolumeClaim: {claimName: stacking-encoders-proxy}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 4Gi}
