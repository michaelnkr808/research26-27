      containers:
      - args:
        - |
          set -euo pipefail
          SMI=""; OWN=0
          R=/mnt/proxy; TAG=baseline-check4-none-s0-try$TRY; D=$(date +%Y%m%d-%H%M%S)
          OUT=$R/runs/$TAG
          WSRC=$R/models/Wan-AI/Wan2.2-TI2V-5B; WAN=/work/wan/Wan2.2-TI2V-5B
          LOG=$R/logs/$TAG-$D.log; GPUCSV=$R/logs/$TAG-gpu-$D.csv
          SMALL="config.json load.json train.json history.jsonl"
          mkdir -p $R/logs $R/runs
          exec > >(tee -a $LOG) 2>&1
          TEE=$!
          echo "=== BASELINE SANITY CHECK 4, TRAINING HALF: config none seed 0, out $OUT (on the PVC)"; date -u
          echo "SRC_GIT_COMMIT=$SRC_GIT_COMMIT TRY=$TRY MAX_STEPS=$MAX_STEPS CKPT_EVERY=$CKPT_EVERY MICRO_BATCH=$MICRO_BATCH"
          [[ "$SRC_GIT_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ABORT: SRC_GIT_COMMIT is not a 40-hex commit (not filled at submit?)"; exit 10; }
          if [ -e $OUT ]; then echo "ABORT: $OUT exists (an earlier attempt's files; set TRY to a new value)"; exit 11; fi
          AV=$(df -BG --output=avail $R | tail -1 | tr -dc 0-9)
          echo "PVC free: ${AV} GiB (need 60)"
          [ "$AV" -ge 60 ] || { echo "ABORT: PVC has ${AV} GiB free, under the 60 GiB the checkpoint writes need"; exit 14; }
          mkdir -p $OUT /work/wan $WAN
          OWN=1
          phase() { echo "=== PHASE $1 $(date -u +%H:%M:%S)"; echo "#phase $1" >> $GPUCSV; }
          finish() {
            rc=$?; set +e
            [ -n "$SMI" ] && { kill $SMI 2>/dev/null; wait $SMI 2>/dev/null; }
            echo "#phase end" >> $GPUCSV
            awk -F', ' 'BEGIN{p="start"} /^#phase/{p=$0; sub(/^#phase /,"",p); next} {v=$2; sub(/ %/,"",v); s[p]+=v; n[p]++; S+=v; N++} END{for(k in n) printf "[gpu-summary] %s: %d samples, mean %.1f%%\n", k, n[k], s[k]/n[k]; if(N) printf "[gpu-summary] all: %d samples, mean %.1f%%\n", N, S/N}' $GPUCSV
            echo "[cgroup] memory.peak $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a) bytes, memory.current $(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo n/a) bytes"
            if [ "$OWN" = 1 ]; then
              for f in $SMALL; do
                if [ -f $OUT/$f ]; then
                  echo "=== FILE $f sha256 $(sha256sum < $OUT/$f | cut -d' ' -f1) bytes $(stat -c %s $OUT/$f)"
                  cat $OUT/$f; echo
                  echo "=== END $f"
                fi
              done
              ls -la $OUT
              df -h $R
            fi
            date -u; echo "=== exit $rc"
            exec 1>&- 2>&-; wait $TEE 2>/dev/null
            exit $rc
