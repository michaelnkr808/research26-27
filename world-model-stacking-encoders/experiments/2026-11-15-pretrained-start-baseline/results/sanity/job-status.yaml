      containers:
      - args:
        - |
          set -euo pipefail
          SMI=""; OWN=0
          R=/mnt/proxy; TAG=baseline-sanity-none-s0-try$TRY; D=$(date +%Y%m%d-%H%M%S)
          OUT=$R/runs/$TAG; W=/work/out
          WSRC=$R/models/Wan-AI/Wan2.2-TI2V-5B; WAN=/work/wan/Wan2.2-TI2V-5B
          LOG=$R/logs/$TAG-$D.log; GPUCSV=$R/logs/$TAG-gpu-$D.csv
          SMALL="first-batch/config.json first-batch/load.json first-batch/first-batch.json first-batch/train.json first-batch/history.jsonl overfit/overfit.json"
          mkdir -p $R/logs $R/runs
          exec > >(tee -a $LOG) 2>&1
          TEE=$!
          echo "=== BASELINE SANITY 1-3 (PLAN Order of work step 3): config none seed 0 local out $W, PVC copies $OUT"; date -u
          echo "SRC_GIT_COMMIT=$SRC_GIT_COMMIT TRY=$TRY OVERFIT_STEPS=$OVERFIT_STEPS MICRO_BATCH=$MICRO_BATCH"
          [[ "$SRC_GIT_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ABORT: SRC_GIT_COMMIT is not a 40-hex commit (not filled at submit?)"; exit 10; }
          if [ -e $OUT ]; then echo "ABORT: $OUT exists (an earlier attempt's files; set TRY to a new value)"; exit 11; fi
          mkdir -p $OUT/first-batch $OUT/overfit $W /work/wan $WAN
          OWN=1
          phase() { echo "=== PHASE $1 $(date -u +%H:%M:%S)"; echo "#phase $1" >> $GPUCSV; }
          finish() {
            rc=$?; set +e
            [ -n "$SMI" ] && { kill $SMI 2>/dev/null; wait $SMI 2>/dev/null; }
            echo "#phase end" >> $GPUCSV
            awk -F', ' 'BEGIN{p="start"} /^#phase/{p=$0; sub(/^#phase /,"",p); next} {v=$2; sub(/ %/,"",v); s[p]+=v; n[p]++; S+=v; N++} END{for(k in n) printf "[gpu-summary] %s: %d samples, mean %.1f%%\n", k, n[k], s[k]/n[k]; if(N) printf "[gpu-summary] all: %d samples, mean %.1f%%\n", N, S/N}' $GPUCSV
            if [ "$OWN" = 1 ]; then
              for f in $SMALL; do
                if [ -f $W/$f ]; then
                  timeout 300 cp $W/$f $OUT/$f || echo "WARNING: copy of $f to $OUT failed or timed out (it is still printed below)"
                  echo "=== FILE $f sha256 $(sha256sum < $W/$f | cut -d' ' -f1) bytes $(stat -c %s $W/$f)"
                  cat $W/$f; echo
                  echo "=== END $f"
                fi
              done
              ls -la $W/* $OUT/* 2>/dev/null
            fi
            date -u; echo "=== exit $rc"
            exec 1>&- 2>&-; wait $TEE 2>/dev/null
            exit $rc
          }
          trap finish EXIT
          nvidia-smi; nproc; df -h $R /work
          echo "/src = ConfigMap stacking-encoders-baseline-src; sha256 of its keys (must equal the commit's, RUN-sanity.md step 3):"
