          : > $GPUCSV
          phase setup
          nvidia-smi --query-gpu=timestamp,utilization.gpu,memory.used --format=csv,noheader -l 15 > >(tee -a $GPUCSV | sed -u 's/^/[gpu] /') &
          SMI=$!
          rc=0; timeout --kill-after=60 1800 bash /src/setup_env.sh > /work/pip-env.log 2>&1 || rc=$?
          [ $rc = 0 ] || { tail -50 /work/pip-env.log; [ $rc = 124 ] && echo "ABORT: pip setup timed out (1800 s)"; [ $rc = 124 ] && exit 124; exit 1; }
          cp /work/pip-env.log $R/logs/pip-env-$TAG.log
          phase stage-wan
          stage() {
            local f=$1 n mib per i pids=""
            n=$(stat -c %s "$WSRC/$f"); mib=$(( (n + 1048575) / 1048576 )); per=$(( (mib + 15) / 16 ))
            : > "$WAN/$f"
            for i in $(seq 0 15); do
              timeout --kill-after=30 900 dd if="$WSRC/$f" of="$WAN/$f" bs=1M skip=$((i * per)) seek=$((i * per)) count=$per conv=notrunc status=none &
              pids="$pids $!"
            done
            for i in $pids; do
              wait $i || { rc=$?; echo "ABORT: a dd of $f failed (rc $rc; 124 = timed out after 900 s)"; [ $rc = 124 ] && exit 124; exit 12; }
            done
            [ "$(stat -c %s "$WAN/$f")" = "$n" ] || { echo "ABORT: staged $f is $(stat -c %s "$WAN/$f") bytes, source $n"; exit 12; }
            echo "staged $f $n bytes"
          }
          T0=$(date +%s)
          stage diffusion_pytorch_model-00001-of-00003.safetensors
          stage diffusion_pytorch_model-00003-of-00003.safetensors
          cp $WSRC/diffusion_pytorch_model.safetensors.index.json $WSRC/config.json $WAN/ || { echo "ABORT: copy of the Wan index/config failed"; exit 12; }
          echo "staging took $(( $(date +%s) - T0 )) s"
          ( cd $WAN && timeout 600 sha256sum -c - <<'EOF'
          720b06c4ade5e87c1246bba8ac95b664c638749cd9b102cf84d823bb44c026a1  diffusion_pytorch_model-00001-of-00003.safetensors
          6306f7894c345de9093ad588771c2abfaeb668a81f7a6d9a918bd26ba3568e49  diffusion_pytorch_model-00003-of-00003.safetensors
          bfa2337f1163e195d24151a72298daf34a620543898109be47e414c8daa5b3fe  diffusion_pytorch_model.safetensors.index.json
          d1fea36899d00c2501b836c13ad65af56e2f9529ba622e50886d3f5c3e6c02bc  config.json
          EOF
          ) || { echo "ABORT: staged Wan files do not match the sha256 in the download log (or the check timed out after 600 s)"; exit 13; }
          echo "staging + sha256 took $(( $(date +%s) - T0 )) s"
          COMMON="--feats $R/feats --suites libero_spatial,libero_object,libero_goal,libero_10 --t5 $R/feats/t5 --config none --seed 0 --wan-dir $WAN --micro-batch $MICRO_BATCH"
          phase first-batch
          echo "FLAGS: python /src/pretrained_train.py $COMMON --first-batch-report --max-steps 20 --out $W/first-batch"
          timeout --kill-after=60 1800 python /src/pretrained_train.py $COMMON --first-batch-report --max-steps 20 --out $W/first-batch
          phase overfit
          echo "FLAGS: python /src/pretrained_train.py $COMMON --overfit-steps $OVERFIT_STEPS --overfit-batch 8 --overfit-lr 1e-4 --out $W/overfit"
          timeout --kill-after=60 1200 python /src/pretrained_train.py $COMMON --overfit-steps $OVERFIT_STEPS --overfit-batch 8 --overfit-lr 1e-4 --out $W/overfit
          echo "=== done"
