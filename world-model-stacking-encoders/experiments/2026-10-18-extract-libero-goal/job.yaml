# Phase 1 pilot: cache frozen SigLIP 2-L and C-RADIOv4-SO400M features for the libero_goal suite (10 files, 500 demos, 2 cams).
# Follows _standards/08: Job (not pod), runs a real command and exits, NO sleep, 1 GPU, limits within 20% of requests,
# activeDeadlineSeconds caps runtime so a hang can't hold an idle GPU. No tolerations.
# Script is mounted from ConfigMap `stacking-encoders-extract-src` (created from ../../src/extract_features.py).
# Output: /persistent/stacking-encoders/features/<encoder>/libero_goal/*.h5 on PVC michael-persistent (RWO, 20Gi).
apiVersion: batch/v1
kind: Job
metadata:
  name: stacking-encoders-extract-libero-goal
  namespace: aria-world
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 14400        # 4 h hard cap (includes time Pending)
  ttlSecondsAfterFinished: 86400      # safety net; delete manually after collecting logs
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              # Turing or newer (fast fp16). Pascal is excluded (slow fp16). A40/A6000 are special resources, not nvidia.com/gpu.
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-GeForce-RTX-2080-Ti, NVIDIA-TITAN-RTX, Quadro-RTX-6000, Quadro-RTX-8000,
                         NVIDIA-GeForce-RTX-3090, NVIDIA-GeForce-RTX-4090, NVIDIA-RTX-A4000, NVIDIA-RTX-A5000,
                         NVIDIA-A10, NVIDIA-L4, NVIDIA-L40, NVIDIA-L40S,
                         NVIDIA-RTX-4000-Ada-Generation, NVIDIA-RTX-5000-Ada-Generation]
              - {key: nvidia.com/cuda.driver.major, operator: Gt, values: ["569"]}   # CUDA 12.8 image needs driver >= 570
      containers:
      - name: main
        image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          nvidia-smi
          OUT=/persistent/stacking-encoders/features
          mkdir -p $OUT /persistent/stacking-encoders/logs
          LOG=/persistent/stacking-encoders/logs/extract-libero-goal-$(date +%Y%m%d-%H%M%S).log
          exec > >(tee -a $LOG) 2>&1
          echo "=== df /persistent"; df -h /persistent
          FREE_GB=$(df -BG --output=avail /persistent | tail -1 | tr -dc 0-9)
          if [ "$FREE_GB" -lt 10 ]; then echo "=== ABORT: only ${FREE_GB}G free on PVC, need >= 10G"; exit 1; fi
          # torch/torchvision listed so pip keeps the image's versions instead of upgrading them.
          pip install --no-cache-dir -q torch==2.7.1 torchvision==0.22.1 \
            transformers==4.57.6 tokenizers==0.22.2 safetensors==0.8.0 huggingface-hub==0.36.2 \
            timm==1.0.30 einops==0.8.1 open-clip-torch==3.3.0 ftfy==6.3.1 regex==2026.9.29 \
            h5py==3.16.0 numpy==2.2.6 pillow==13.0.0
          echo "=== pip freeze"; pip freeze
          echo "=== download libero_goal"; date -u
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("yifengzhu-hf/LIBERO-datasets", repo_type="dataset", revision="main",
                            allow_patterns=["libero_goal/*.hdf5"], local_dir="/work/data")
          PY
          ls -la /work/data/libero_goal; date -u
          X=/src/extract_features.py
          echo "=== siglip2"; python $X --encoder siglip2 --variant google/siglip2-large-patch16-384 \
            --dtype float16 --batch-size 64 --out $OUT --hdf5 /work/data/libero_goal/*.hdf5
          echo "=== c-radiov4"; python $X --encoder c-radiov4 \
            --dtype float16 --batch-size 64 --out $OUT --hdf5 /work/data/libero_goal/*.hdf5
          echo "=== outputs"; du -sh $OUT/*/libero_goal; df -h /persistent; date -u
          echo "=== done"
        env:
        - {name: SRC_GIT_COMMIT, value: f4a7b82edf0e828e15dd057463e82e71f53d666d}   # commit of the ConfigMap'd script
        - {name: HF_HOME, value: /work/hf}
        - {name: MPLBACKEND, value: Agg}
        - {name: PYTHONUNBUFFERED, value: "1"}
        resources:                    # limits within 20% of requests
          requests: {cpu: "2", memory: 10Gi, nvidia.com/gpu: "1", ephemeral-storage: 14Gi}
          limits:   {cpu: "2", memory: 12Gi, nvidia.com/gpu: "1", ephemeral-storage: 16Gi}
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: src, mountPath: /src, readOnly: true}
        - {name: persistent-vol, mountPath: /persistent}
      volumes:
      - name: work
        emptyDir: {sizeLimit: 16Gi}
      - name: src
        configMap: {name: stacking-encoders-extract-src}
      - name: persistent-vol
        persistentVolumeClaim: {claimName: michael-persistent}
