          echo "=== start $(date -u) node=${NODE_NAME:-?}"
          A=/mnt/aside
          CACHE=/mnt/proxy/feats/siglip2/libero_spatial
          EXP="ep000272.npy ep000272.stats.npy ep000274.npy ep000274.stats.npy ep000276.npy ep000276.stats.npy ep000278.npy ep000278.stats.npy ep000280.npy ep000280.stats.npy ep000282.npy ep000282.stats.npy ep000284.npy ep000284.stats.npy ep000286.npy ep000286.stats.npy"
          # --- mounts: /mnt/proxy read-only, /mnt/aside a separate read-write mount
          grep -E ' (/mnt/proxy|/mnt/aside) ' /proc/mounts
          PO=$(awk '$2=="/mnt/proxy"{o=$4} END{print o}' /proc/mounts)
          AO=$(awk '$2=="/mnt/aside"{o=$4} END{print o}' /proc/mounts)
          case ",$PO," in *,ro,*) ;; *) echo "ABORT (20): /mnt/proxy is not mounted read-only (options: '$PO')"; exit 20 ;; esac
          case ",$AO," in *,rw,*) ;; *) echo "ABORT (20): /mnt/aside is not a read-write mount (options: '$AO')"; exit 20 ;; esac
          [ -d "$CACHE" ] || { echo "ABORT (20): $CACHE is missing"; exit 20; }
          RO=/mnt/proxy/logs/siglip2-repair-e5377cd5-8d1c-47a8-84c5-d2ce617540df/libero_spatial
          [ -d "$RO" ] && [ "$(stat -c %i "$A")" = "$(stat -c %i "$RO")" ] || { echo "ABORT (20): $A is not the folder $RO (inodes $(stat -c %i "$A" 2>&1) / $(stat -c %i "$RO" 2>&1))"; exit 20; }

          # --- READ
          echo "=== READ $(date -u)"
          show() {
            local f=$1 b; b=$(stat -c %s "$f")
            if [ "$b" -gt 8388608 ]; then echo "@@@ SKIPPED $f bytes $b (over 8 MB)"; return; fi
            echo "@@@ BEGIN $f sha256 $(sha256sum < "$f" | cut -d' ' -f1) bytes $b lines $(wc -l < "$f")"
            cat "$f"; echo
            echo "@@@ END $f"
          }
          READ_RC=30
          ls -la --time-style=full-iso /mnt/proxy/logs/ | grep -F pairings-smoke || echo "no pairings-smoke file in /mnt/proxy/logs"
          ls -laR --time-style=full-iso /mnt/proxy/rollouts/pairings-smoke/none-s0/ || echo "no rollouts folder for the none smoke"
          for f in /mnt/proxy/logs/pairings-smoke-none-s0-*; do
            [ -f "$f" ] || continue
            case "$f" in *.log) READ_RC=0 ;; esac
            show "$f"
          done
          while IFS= read -r f; do show "$f"; done < <(find /mnt/proxy/rollouts/pairings-smoke/none-s0 -type f 2>/dev/null | sort)
          [ "$READ_RC" = 0 ] || echo "READ PROBLEM (30): no /mnt/proxy/logs/pairings-smoke-none-s0-*.log"

          # --- DELETE
          echo "=== DELETE $(date -u): $A = logs/siglip2-repair-e5377cd5-8d1c-47a8-84c5-d2ce617540df/libero_spatial"
          df -h /mnt/proxy | tail -1
          ls -la --time-style=full-iso "$A"
          LIST=$(find "$A" -xdev -mindepth 1 -printf '%y %P\n' | sort -k2)
          n=0; bad=0
          while read -r t p; do
            [ -n "$t" ] || continue
            n=$((n+1))
            case " $EXP " in
              *" $p "*) [ "$t" = f ] || { echo "UNEXPECTED type $t: $p"; bad=1; } ;;
              *) echo "UNEXPECTED entry: $t $p"; bad=1 ;;
            esac
          done <<< "$LIST"
          echo "entries in the aside folder: $n (16 on a first run)"
          for p in $EXP; do
            [ -s "$CACHE/$p" ] || { echo "MISSING or empty replacement in the cache: $CACHE/$p"; bad=1; }
          done
          if [ "$bad" != 0 ]; then echo "ABORT (23): nothing deleted"; exit 23; fi
          for p in $EXP; do
            [ -f "$A/$p" ] || continue
            echo "to delete: $p bytes $(stat -c %s "$A/$p") sha256 $(sha256sum < "$A/$p" | cut -d' ' -f1); replacement bytes $(stat -c %s "$CACHE/$p")"
          done
          for p in $EXP; do find "$A" -xdev -mindepth 1 -maxdepth 1 -type f -name "$p" -delete; done
          left=$(find "$A" -mindepth 1 | wc -l) || { echo "ABORT (24): could not list $A after the delete"; exit 24; }
          echo "--- after $(date -u)"; ls -la --time-style=full-iso "$A"; df -h /mnt/proxy | tail -1
          [ "$left" = 0 ] || { echo "ABORT (24): $left entries left in $A"; exit 24; }
          echo "=== deleted: $n file(s); $A is empty"
          echo "=== exit $READ_RC $(date -u)"
          exit $READ_RC
        command:
