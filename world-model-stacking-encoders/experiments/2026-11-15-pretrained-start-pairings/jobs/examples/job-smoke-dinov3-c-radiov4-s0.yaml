# EXAMPLE RENDER, NOT FOR SUBMISSION (written by render.sh smoke dinov3+c-radiov4 0; placeholders FILL_* left in: the pod aborts on them).
# Example inputs are illustrations, not measurements: --clean-rate none given, --lp-rate none given (215 is stage 1's
# timing-only CLEAN rate for none; no LIBERO-Plus rate has been measured).
# RENDERED by jobs/render.sh from jobs/job-smoke.template.yaml: smoke dinov3+c-radiov4 seed 0: clean pass 1, LIBERO-Plus timing shard 1, envs 4, try 1, checkpoint /mnt/proxy/runs/pairings-dinov3-c-radiov4-s0
# STAGE 2 TIMING-ONLY SMOKE TEMPLATE, one per configuration, on L4 (PLAN Hand-off step 5; Evaluation "On L4 cards only";
# Decision rule item 6: the smoke runs for every configuration before any evaluation). Also the FIRST LIBERO-PLUS TIMING SHARD
# (PLAN amendment 2026-11-17 item 1: LIBERO-Plus evaluation time per checkpoint is still blank; it is filled from stage 2's own
# timing shard before the first LIBERO-Plus submission).
# NOT SUBMITTED. Render with jobs/render.sh smoke <config> (RUN-stage2-eval.md); never submit this file.
# BASED ON: ../../2026-11-15-pretrained-start-baseline/jobs/job-check4-smoke.yaml (ran on an L4, stage 1 LOG 2026-11-16) for the
#   timing-only pass, and job-clean-eval.yaml (ran to exit 0, 4 shards) for the hash pins, model pin, exit trap and retry policy.
# WHAT IT RUNS, on the seed 0 checkpoint of the configuration (timing-only: rollout.py --timing-only ignores the done signal, every
#   episode runs to its step limit, records and logs hold no success; so no test outcome exists or is seen):
#   pass "clean" (CLEAN_SMOKE=1): --clean 1, the 40 clean tasks x trial 0, eval seed 41: stage 1's smoke, now per configuration
#     (fit on the L4 with the encoders, GPU use, time per episode). For none it is 0: stage 1 ran it (215 episodes per pod-hour).
#   pass "lp-timing" (LP_TIMING=1): --lp-timing-shard <task_classification.json> --clean-seed 41: one LIBERO-Plus episode per
#     (suite, perturbation category) cell, 28 episodes, eval seed 41 (rollout.py smoke_jobs, include_clean False). The
#     classification file comes from the env bundle's LIBERO-plus checkout at 4976dc3 and is checked against data/README.md's
#     sha256 faa87cce... (exit 21). Its per-episode wall_s, weighted by cell size, is the upper-bound LIBERO-Plus rate that
#     sizes job-lp-eval's shards and caps (RUN-stage2-eval.md step "LIBERO-Plus timing").
#   Both are test-task uses without outcomes (_standards/07 line 6), logged as such.
# CHANGES vs stage 1's smoke: config and seed rendered; two passes in one pod (one env restore, about 10 min, instead of two);
#   backoffLimit 2 with podFailurePolicy instead of 0 (_standards/08: > 0 so a Job survives node reboots; a retried pod resumes
#   the timing-only records, which check_resume allows for a timing-only file); model.pt sha256 pin; hash pins on /src;
#   HF_TOKEN for encoder configs.
# DEADLINES: each pass capped at 5,400 s (stage 1's smoke cap; stage 1's 40-episode pass took about 11 min at 215 per hour).
#   Pod activeDeadlineSeconds 13,200 s: setup 1,800 (model sha256 up to 900, restore about 600, load about 300) + 2 x (5,400 +
#   60 kill grace) + trap 120 = 12,840, rounded up. Expected well under 1 h per pod (stage 1: restore 9-10 min, model load about
#   4 min, then the passes). Job activeDeadlineSeconds 79,200 (22 h, stage 1's smoke: 20 h of L4 queue + 2 x the pod).
#   ttlSecondsAfterFinished 86,400.
# GPU USE: the restore and the model load are GPU-idle (stage 1 smoke whole-pod 37%, rollout phase 89%). The pod runs well under
#   the portal's 180-minute minimum runtime for the idle warning (_standards/08 [NRP code] item 2), and the mean is logged.
# COMMON TO THE THREE EVALUATION TEMPLATES (job-smoke, job-clean-eval, job-lp-eval):
#   On NVIDIA L4 only (PLAN Evaluation: a move off L4 is a stop for the user), us-west, driver > 569, the two host exclusions; no
#   named resources, no tolerations, no priority class. restartPolicy Never; podFailurePolicy FailJob only on this script's own
#   deterministic codes (2 argparse, 10 not rendered, 13 model.pt hash pin, 15 model.pt missing, 19 /src hash pin, 21 a pinned
#   input file differs: the LIBERO-Plus episode list or task_classification.json), Ignore on DisruptionTarget; everything else
#   (1, 16 timeouts, 137, node loss) is retried and resumes from the records file (rollout.py done_keys / check_resume).
#   Code: ConfigMap stacking-encoders-pairings-eval-src, the same 11 keys as stage 1's stacking-encoders-baseline-eval-src
#   (rollout.py's import chain plus the three env-bundle scripts), created from the stage 2 source commit; the 11 sha256 are
#   rendered into the heredoc (exit 19 on a mismatch). The env bundle key must print 9182f8131559 (stage 1's bundle,
#   /mnt/proxy/env/env-9182f8131559.tar; rollout.py, setup_env.sh, setup_sim.sh and env_bundle.sh are unchanged since stage 1's
#   commit, git log 2026-11-17).
#   Checkpoint pin: EXPECT_MODEL_SHA is rendered from the training pod's "=== MODEL" line (none seed 0: stage 1's
#   b25e63e61d6297d523eb75f9e334f179e5faac58c06aaa81da92d4ca3fcdc732, stage 1 LOG line 152); the pod hashes model.pt and
#   aborts (13) on a difference.
#   Encoder configs need the encoder weights from Hugging Face at pod start (rollout.Featurizer, extract_features loaders; DINOv3
#   is gated): the HF_TOKEN env from Secret stacking-encoders-hf, as every proxy rollout Job used (job-rollout.template.yaml). The
#   lines tagged @HFTOKEN are deleted by render.sh for config none (stage 1 mounted no secret: only the Wan VAE file is read).
#   Inputs as stage 1 (job-clean-eval.yaml header): --t5 /mnt/proxy/feats/t5, --vae-path /mnt/proxy/models/Wan2.2_VAE.safetensors,
#   --tasks /mnt/proxy/lp_tasks.json; the checkpoint from RUN_DIR (on stacking-encoders-proxy, or on the second volume, mounted
#   Sizing: stage 1's L4 values, which ran this model for none (CPU 4 / 4800m, memory 28Gi / 33Gi, ephemeral 50Gi / 58Gi, /work
#   58Gi, /dev/shm 4Gi; limits within 1.2x). Encoder configs add the encoders on the GPU and their Hugging Face files in /work/hf
#   (a few GB; recalled sizes), not host working set beyond a load; the smoke prints memory.peak and anon, and GPU memory per
#   [gpu] sample, so the first smoke of each config shows whether the L4 holds the model plus the encoders. A CUDA
#   out-of-memory there is a stop for the user (PLAN: no move off L4 without the user; fewer environments or CUDA_GRAPH 0 are
#   re-renders the lead can propose).
#   GPU use (STANDARDS.md line 48; _standards/08 GPU section): stage 1's 4 environments gave 89% in the rollout phase for none
#   (stage 1 LOG 2026-11-16) and about 50-100% per 30 s sample in the clean evaluation. ENVS is rendered per config from its
#   smoke: raise it until the 10-minute GPU windows are at or above 40%, otherwise stop for the user (stage 1 rule, PLAN
#   Compute "Idle GPUs").
# Exit codes: 0 done, 1 Python error / restore failed / nvidia-smi failed, 2 argparse (fatal), 10 not rendered (fatal), 13 model.pt
#   hash pin (fatal), 15 model.pt missing (fatal), 16 a pass or a setup step timed out (retried), 19 /src hash pin (fatal),
#   21 task_classification.json hash (fatal). Table: RUN-stage2-eval.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: stacking-encoders-pairings-smoke-dinov3-c-radiov4-s0
  namespace: aria-world
  labels: {experiment: stacking-pairings, kind: smoke, config: dinov3-c-radiov4, seed: "0"}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 79200
  ttlSecondsAfterFinished: 86400
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes:
        containerName: main
        operator: In
        values: [2, 10, 13, 15, 19, 21]
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
        status: "True"
  template:
    metadata:
      labels: {experiment: stacking-pairings, kind: smoke, config: dinov3-c-radiov4, seed: "0"}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: 13200
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-L4]
              - {key: nvidia.com/cuda.driver.major, operator: Gt, values: ["569"]}
              - {key: topology.kubernetes.io/region, operator: In, values: [us-west]}
              - {key: kubernetes.io/hostname, operator: NotIn, values: [k8s-chase-ci-07.calit2.optiputer.net, ry-gpu-08.sdsc.optiputer.net]}  # GPU faults, 2026-11-03
      containers:
      - name: main
        image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          SMI=""; DECLARED=0
          fail() { DECLARED=1; exit $1; }
          R=/mnt/proxy; TAG=pairings-smoke-$CFGK-s$SEED-try$SMOKE_TRY; D=$(date +%Y%m%d-%H%M%S)
          RUN=$RUN_DIR
          ROLL=$R/rollouts/pairings-smoke/$CFGK-s$SEED
          OUT_CLEAN=$ROLL/smoke-clean-try$SMOKE_TRY.jsonl; OUT_LP=$ROLL/smoke-lp-timing-try$SMOKE_TRY.jsonl
          OUTS=""; [ "$CLEAN_SMOKE" = 1 ] && OUTS="$OUTS $OUT_CLEAN $OUT_CLEAN.errors.jsonl"; [ "$LP_TIMING" = 1 ] && OUTS="$OUTS $OUT_LP $OUT_LP.errors.jsonl"
          LOG=$R/logs/$TAG-$D.log; GPUCSV=$R/logs/$TAG-gpu-$D.csv
          mkdir -p $R/logs $ROLL
          exec > >(tee -a $LOG) 2>&1
          TEE=$!
          : > $GPUCSV
          phase() { echo "=== PHASE $1 $(date -u +%H:%M:%S)"; echo "#phase $1" >> $GPUCSV; }
          finish() {
            rc=$?; set +e
            case $rc in 2|10|13|15|19|21) [ "$DECLARED" = 1 ] || { echo "[exit] code $rc came from a tool, not a decision of this script; reporting 1"; rc=1; } ;; esac
            [ -n "$SMI" ] && { kill $SMI 2>/dev/null; wait $SMI 2>/dev/null; }
            echo "#phase end" >> $GPUCSV
            awk -F', ' 'BEGIN{p="start"} /^#phase/{p=$0; sub(/^#phase /,"",p); next} {v=$2; sub(/ %/,"",v); s[p]+=v; n[p]++; S+=v; N++} END{for(k in n) printf "[gpu-summary] %s: %d samples, mean %.1f%%\n", k, n[k], s[k]/n[k]; if(N) printf "[gpu-summary] all: %d samples, mean %.1f%%\n", N, S/N}' $GPUCSV
            echo "[cgroup] memory.peak $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo n/a) bytes, memory.current $(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo n/a) bytes"
            echo "[cgroup] $(grep -E '^anon ' /sys/fs/cgroup/memory.stat 2>/dev/null || echo 'anon n/a') (bytes, at exit); $(grep -E '^file ' /sys/fs/cgroup/memory.stat 2>/dev/null || echo 'file n/a') (page cache)"
            for f in $OUTS; do
              if [ -f $f ]; then
                echo "=== FILE $(basename $f) sha256 $(sha256sum < $f | cut -d' ' -f1) bytes $(stat -c %s $f) lines $(wc -l < $f)"
                cat $f   # timing-only records: job key, wall time, fixed steps, errors; no outcome (rollout.py --timing-only)
                echo "=== END $(basename $f)"
              fi
            done
            for f in $OUTS; do case $f in *.errors.jsonl) [ -f $f ] && echo "[errors] $(basename $f) EXISTS: read it";; esac; done
            date -u; echo "=== exit $rc"
            exec 1>&- 2>&-; wait $TEE 2>/dev/null
            exit $rc
          }
          trap finish EXIT
          echo "=== STAGE 2 TIMING-ONLY SMOKE on L4: config $CONFIG seed $SEED; clean pass (40 clean tasks x trial 0) $CLEAN_SMOKE, LIBERO-Plus timing shard (one episode per suite x category cell, 28) $LP_TIMING; checkpoint $RUN/model.pt -> $ROLL"; date -u
          echo "SRC_GIT_COMMIT=$SRC_GIT_COMMIT SMOKE_TRY=$SMOKE_TRY ENVS=$ENVS CUDA_GRAPH=$CUDA_GRAPH PASS_CAP_S=$PASS_CAP_S"
          [[ "$CLEAN_SMOKE$LP_TIMING" =~ ^[01][01]$ && "$CLEAN_SMOKE$LP_TIMING" != 00 ]] || { echo "ABORT: CLEAN_SMOKE '$CLEAN_SMOKE' / LP_TIMING '$LP_TIMING' must be 0 or 1, not both 0"; fail 10; }
          [[ "$SRC_GIT_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "ABORT: SRC_GIT_COMMIT is not a 40-hex commit (not filled at submit?)"; fail 10; }
          [[ "$EXPECT_MODEL_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "ABORT: EXPECT_MODEL_SHA is not a sha256 (not rendered from the training log's === MODEL line?)"; fail 13; }
          [[ "$SEED" =~ ^[0-9]+$ && -n "$CONFIG" && "$CFGK" = "$(echo "$CONFIG" | tr '+' '-')" ]] || { echo "ABORT: CONFIG '$CONFIG' / CFGK '$CFGK' / SEED '$SEED' not rendered consistently"; fail 10; }
          echo "/src = ConfigMap stacking-encoders-pairings-eval-src; checking its 11 keys against the hashes rendered into this manifest (RUN-stage2-eval.md step 4):"
          ( cd /src && sha256sum -c - <<'EOF'
          FILL_SHA_rollout.py  rollout.py
          FILL_SHA_lp_eval.py  lp_eval.py
          FILL_SHA_proxy_wam.py  proxy_wam.py
          FILL_SHA_t5_cache.py  t5_cache.py
          FILL_SHA_diagnostics.py  diagnostics.py
          FILL_SHA_extract_fastwam.py  extract_fastwam.py
          FILL_SHA_extract_features.py  extract_features.py
          FILL_SHA_fastwam_data.py  fastwam_data.py
          FILL_SHA_setup_env.sh  setup_env.sh
          FILL_SHA_setup_sim.sh  setup_sim.sh
          FILL_SHA_env_bundle.sh  env_bundle.sh
          EOF
          ) || { echo "ABORT: a /src key differs from the hash rendered at submit (the ConfigMap changed after the render, or the render did not run)"; fail 19; }
          echo "env bundle key: $(cat /src/setup_env.sh /src/setup_sim.sh /src/env_bundle.sh | sha256sum | cut -c1-12) (the prebuilt bundle is 9182f8131559)"
          [ -f $RUN/model.pt ] || { echo "ABORT: $RUN/model.pt is missing (did the training Job succeed? is RUN_DIR right?)"; fail 15; }
          ls -la $RUN/model.pt
          for f in $OUT_CLEAN $OUT_LP; do if [ -e $f ]; then echo "MODE: resume $(basename $f) ($(wc -l < $f) lines already)"; fi; done
          nvidia-smi || { echo "ABORT: nvidia-smi failed (a faulty GPU node; retryable)"; exit 1; }
          nproc; df -h $R /work
          phase model-sha
          MSHA=$(timeout --kill-after=60 900 sha256sum $RUN/model.pt) || { echo "ABORT: model.pt sha256 failed or timed out (900 s)"; exit 16; }
          echo "=== MODEL $MSHA"
          [ "${MSHA%% *}" = "$EXPECT_MODEL_SHA" ] || { echo "ABORT: model.pt sha256 ${MSHA%% *} differs from the pinned $EXPECT_MODEL_SHA (the training log's === MODEL line)"; fail 13; }
          echo "model.pt sha256 equals the pinned value"
          nvidia-smi --query-gpu=timestamp,utilization.gpu,memory.used --format=csv,noheader -l 30 > >(tee -a $GPUCSV | sed -u 's/^/[gpu] /') &
          SMI=$!
          phase restore
          . /src/env_bundle.sh restore    # as the smoke and the proxy's rollout Jobs; sourced, so it cannot be wrapped in `timeout`; a failure exits via set -e
          GRAPH=""; [ "$CUDA_GRAPH" = 1 ] && GRAPH="--cuda-graph"
          BASE="--run-dir $RUN --t5 $R/feats/t5 --vae-path $R/models/Wan2.2_VAE.safetensors --tasks $R/lp_tasks.json --timing-only $GRAPH --monitor-s 600 --shard 0/1"
          pass() {   # $1 name, $2 records file, rest: the pass's own flags; timing-only, so no outcome is computed or logged
            local name=$1 out=$2 rc=0 T1; shift 2
            phase rollout-$name-envs$ENVS
            echo "FLAGS: python /src/rollout.py run $BASE $* --envs $ENVS --out $out"
            T1=$SECONDS
            timeout --kill-after=60 $PASS_CAP_S python /src/rollout.py run $BASE "$@" --envs $ENVS --out $out 2>&1 | sed "/using task orders/d" || rc=$?
            echo "[pass] $name: rc $rc, $(( SECONDS - T1 )) s wall, $(wc -l < $out 2>/dev/null || echo 0) records"
            case $rc in
              0) ;;
              2) echo "ABORT: rollout.py exited 2 (argparse: a bad flag, deterministic)"; fail 2 ;;
              124) echo "ABORT: the $name pass hit its $PASS_CAP_S s cap (records so far are in the file; a retry resumes)"; exit 16 ;;
              137) if [ $(( SECONDS - T1 )) -ge $PASS_CAP_S ]; then echo "ABORT: the $name pass hit its $PASS_CAP_S s cap (killed after the grace)"; exit 16; fi; exit 137 ;;
              *) exit $rc ;;
            esac
          }
          if [ "$CLEAN_SMOKE" = 1 ]; then pass clean $OUT_CLEAN --clean 1; fi
          if [ "$LP_TIMING" = 1 ]; then
            CLS=$SIM_DIR/LIBERO-plus/libero/libero/benchmark/task_classification.json
            echo "faa87cce3e3ba434da01df7c77523a391b5f2912e4774330b0aa1be5f6a999e6  $CLS" | sha256sum -c - || { echo "ABORT: task_classification.json differs from the one data/README.md records"; fail 21; }
            pass lp-timing $OUT_LP --lp-timing-shard $CLS --clean-seed 41
          fi
          echo "=== done"
        env:
        - {name: SRC_GIT_COMMIT, value: FILL_AT_SUBMIT}
        - {name: EXPECT_MODEL_SHA, value: FILL_MODEL_SHA}   # the training pod's "=== MODEL" sha256 of model.pt, rendered
        - {name: CONFIG, value: "dinov3+c-radiov4"}
        - {name: CFGK, value: "dinov3-c-radiov4"}
        - {name: SEED, value: "0"}
        - {name: RUN_DIR, value: "/mnt/proxy/runs/pairings-dinov3-c-radiov4-s0"}       # the training Job's out folder (none seed 0: stage 1's baseline-none-s0)
        - name: HF_TOKEN                              # @HFTOKEN encoder weights from Hugging Face (DINOv3 is gated); not rendered for none
          valueFrom:                                  # @HFTOKEN
            secretKeyRef: {name: stacking-encoders-hf, key: HF_TOKEN}   # @HFTOKEN
        - {name: SMOKE_TRY, value: "1"}         # names the records files; a new value starts over
        - {name: CLEAN_SMOKE, value: "1"}   # 1: timing-only clean pass (40 episodes); none: 0 (stage 1 ran it)
        - {name: LP_TIMING, value: "1"}       # 1: timing-only LIBERO-Plus shard (28 episodes)
        - {name: ENVS, value: "4"}      # from this config's smoke (stage 1 rule: raise until GPU >= 40%); none: 4
        - {name: CUDA_GRAPH, value: "1"}
        - {name: PASS_CAP_S, value: "5400"}       # per pass, as stage 1's smoke (header)
        - {name: HF_HOME, value: /work/hf}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: PYTHONPATH, value: /src}
        - {name: SIM_DIR, value: /work/sim}
        - {name: MUJOCO_GL, value: egl}
        - {name: PYOPENGL_PLATFORM, value: egl}
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility,graphics"}
        resources:                    # the smoke's values (it ran this model on an L4); limits <= 1.2x requests; header
          requests: {cpu: "4", memory: 28Gi, nvidia.com/gpu: "1", ephemeral-storage: 50Gi}
          limits:   {cpu: "4800m", memory: 33Gi, nvidia.com/gpu: "1", ephemeral-storage: 58Gi}
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: src, mountPath: /src, readOnly: true}
        - {name: proxy, mountPath: /mnt/proxy}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: work
        emptyDir: {sizeLimit: 58Gi}   # pip, LIBERO-Plus + unzipped assets (the bundle)
      - name: src
        configMap: {name: stacking-encoders-pairings-eval-src}
      - name: proxy
        persistentVolumeClaim: {claimName: stacking-encoders-proxy}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 4Gi}
