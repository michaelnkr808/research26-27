# NOT SUBMITTED (written 2026-11-09, Mac only; no kubectl run, no dry run). Submit only on the user's go, brought by the lead
# (PLAN "Amendment 2026-11-09 (c)" section 7 item 3 is still OPEN; the user chose "Phase B first, then the 13": nothing
# proxy-side is submitted while the perturbed-frames phase B GPU Jobs run). Fill SRC_GIT_COMMIT at submit (jobs/RETRAIN.md).
# IMPLEMENTS: PLAN "Sign-off note 2026-11-09 for Amendment 2026-11-09 (c)", option B1 = the deeper model: dinov3, 16 layers,
# everything else at the defaults (10 epochs = 21,696 steps, batch 128, hidden 384, 3 heads). User, 2026-11-09, verbatim:
# "yeah sure then just go with the deeper 16 layer model, with the doubel epochs as the fallbak". Level target (user):
# "Yes: mean success at least 27 points (Recommended)". Thresholds unchanged (T 2.7, floor 2.7).
# FALLBACK RULE: if THIS Job fails before completing its first epoch (about 2,170 of 21,696 steps) because of CUDA out of memory or an
# assertion/exception while building the 16-layer model, the lead uses jobs/job-train-retrain-dinov3-e20.yaml (the 20-epoch
# fallback, default size) for both seeds. A run that trains to the end but scores badly is NOT a reason to switch (that would be
# a second retrain, which the amendment forbids). Evidence that counts: jobs/RETRAIN.md.
# Training seeds 0 and 1 of config dinov3 in one Indexed Job (pod i trains pair i of PAIRS), out dirs /mnt/proxy/runs/dinov3-l16-s0
# and -s1 (new; no earlier Job wrote there). The script aborts (exit 3) if the out dir already holds ckpt.pt or model.pt, because
# proxy_wam.py would silently resume an old checkpoint from <out>/ckpt.pt; set env RESUME to 1 only to resume this same run
# deliberately (it bypasses the ckpt.pt check only; a finished model.pt always aborts).
# Copied from job-train-wave1c-dinov3-s0-a40.yaml (the working training manifest): image, ConfigMap, PVC, data paths, feature roots,
# T5 cache, env (OMP_NUM_THREADS 3, MALLOC_ARENA_MAX 2), CPU and memory requests/limits, node exclusions. Differences from it:
# name; completions 2 / parallelism 2 (as wave 1); backoffLimit 0 (a failure ends the Job, so the fallback decision is clean; the
# wave-1 Jobs used 4); GPU = the generic nvidia.com/gpu with the training list of PLAN "Amendment 2026-11-06 (b)" (RTX 3090, 4090,
# A5000, L40, L40S; the A40 and RTX A6000 gpu.product entries matched nothing and are dropped; no named resource, which would need
# the user's OK each time); --layers 16; --out; log names; guard. Nothing waits idle and no node taints are tolerated.
# Sizing: CPU 4 / 4800m and memory 28Gi / 33Gi (1.18x) are kept from wave 1 (measured: working set 22 GiB at 500 steps with a
# 17.8 GiB replay buffer, LOG 2026-11-02 (c)). The replay buffer is host RAM and does not depend on the layer count; the model
# itself lives on the GPU. Peak host memory of the full wave-1 runs was not recorded (not verified), and none was measured for
# 16 layers. GPU memory for 16 layers is NOT known: 8 layers trained on a 24 GB RTX 3090; whether 16 fit there is the open
# question the fallback rule covers (speculative).
# Time: about 8 h per run (speculative: 2x the 0.64 to 0.65 s/step measured at 8 layers over 21,696 steps = 7.7 to 7.9 h, plus
# about 0.2 h setup; less if data wait is a larger share). activeDeadlineSeconds 129600 (36 h, counts from Job creation, queue
# included) = 2 x 8 h (16 h) + 20 h for the queue (round 1 queued 3 h to 9 h+, LOG 2026-11-06 (a), (c)). A pod can start as late
# as about 28 h after creation and still finish. Below the 48 h stop line (RUN.md stop 5). ttl 24 h: save pod logs within 24 h.
# GPU use: wave 1 measured 76 to 97% (LOG 2026-11-07 (b)); no in-pod sampler (the wave-1c manifest had none).
apiVersion: batch/v1
kind: Job
metadata:
  name: stacking-encoders-proxy-train-retrain-dinov3-l16
  namespace: aria-world
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 0
  activeDeadlineSeconds: 129600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-GeForce-RTX-3090, NVIDIA-GeForce-RTX-4090, NVIDIA-RTX-A5000, NVIDIA-L40, NVIDIA-L40S]
              - {key: nvidia.com/cuda.driver.major, operator: Gt, values: ["569"]}
              - {key: topology.kubernetes.io/region, operator: In, values: [us-west]}
              - {key: kubernetes.io/hostname, operator: NotIn, values: [k8s-chase-ci-07.calit2.optiputer.net, ry-gpu-08.sdsc.optiputer.net]}  # GPU faults, 2026-11-03
      containers:
      - name: main
        image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          R=/mnt/proxy; I=$JOB_COMPLETION_INDEX
          P=($PAIRS); C=${P[$I]%%:*}; S=${P[$I]##*:}
          OUT=$R/runs/$C-l16-s$S
          mkdir -p $R/logs $R/runs
          exec > >(tee -a $R/logs/train-retrain-l16-$C-s$S-$(date +%Y%m%d-%H%M%S).log) 2>&1
          echo "=== RETRAIN B1 (16 layers) index $I: config $C seed $S out $OUT"; date -u
          echo "SRC_GIT_COMMIT=$SRC_GIT_COMMIT RESUME=$RESUME"
          [ "$SRC_GIT_COMMIT" != FILL_AT_SUBMIT ] || { echo "ABORT: SRC_GIT_COMMIT not filled at submit"; exit 2; }
          if [ -e $OUT/model.pt ]; then echo "ABORT: $OUT/model.pt exists (a finished run); refusing to overwrite"; exit 3; fi
          if [ -e $OUT/ckpt.pt ] && [ "$RESUME" != 1 ]; then echo "ABORT: $OUT/ckpt.pt exists; proxy_wam.py would resume an old run (set RESUME=1 only to resume this run on purpose)"; exit 3; fi
          nvidia-smi; nproc
          bash /src/setup_env.sh > /work/pip-env.log 2>&1 || { tail -50 /work/pip-env.log; exit 1; }
          cp /work/pip-env.log $R/logs/pip-env-retrain-l16-$C-s$S.log
          FLAGS="--feats $R/feats --suites libero_spatial,libero_object,libero_goal,libero_10 --t5 $R/feats/t5 --config $C --seed $S --layers 16 --out $OUT"
          echo "FLAGS: python /src/proxy_wam.py $FLAGS"
          python /src/proxy_wam.py $FLAGS
          date -u; echo "=== done"
        env:
        - {name: SRC_GIT_COMMIT, value: FILL_AT_SUBMIT}
        - {name: RESUME, value: "0"}
        - {name: PAIRS, value: "dinov3:0 dinov3:1"}
        - {name: HF_HOME, value: /work/hf}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: PYTHONPATH, value: /src}
        - {name: OMP_NUM_THREADS, value: "3"}
        - {name: MALLOC_ARENA_MAX, value: "2"}
        resources:                    # as the wave-1c manifest; limits <= 1.2x requests
          requests: {cpu: "4", memory: 28Gi, nvidia.com/gpu: "1", ephemeral-storage: 20Gi}
          limits:   {cpu: "4800m", memory: 33Gi, nvidia.com/gpu: "1", ephemeral-storage: 24Gi}
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: src, mountPath: /src, readOnly: true}
        - {name: proxy, mountPath: /mnt/proxy}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: work
        emptyDir: {sizeLimit: 24Gi}
      - name: src
        configMap: {name: stacking-encoders-proxy-src}
      - name: proxy
        persistentVolumeClaim: {claimName: stacking-encoders-proxy}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 2Gi}
