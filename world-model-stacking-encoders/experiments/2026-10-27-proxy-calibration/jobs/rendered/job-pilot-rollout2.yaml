# Rendered 2026-11-03 for the RUN step 9 pilot rollouts after the GPU fix (LOG 2026-11-03 (b), (d), (e), (h)). Policy
# path from dbbc71d: start noise cached per eval seed, torch threads = pod CPUs, --cuda-graph (graph == eager exactly
# in profile run 2). Policy-only profile on an RTX 3090 keeps the GPU busy from batch 2 up, so 4 envs per pod stay.
# Fewer, longer pods (one per checkpoint, all 340 jobs) so the env-bundle restore + assets unzip happens twice, not 8x.
# New output dir pilot-rollout2: the 46 records from the stopped pilot (old shard layout, old policy path) are not mixed in.
# Sizing as the 2026-11-03 (a) render (cgroup peak 18.45 GB of 20Gi with 4 envs; CPU 1.5-3.3 of 4), backoffLimit 4,
# the two nodes with GPU faults excluded.
# 2026-11-03 21:05 UTC resubmit (user OK): pods sat Pending ~3 h 50 min; GPU list widened to A10, L4, A40 (24-48 GB),
# since rollouts need at most ~10 GB GPU memory policy-only (profile run 2); the old list was carried over from training.
# 2026-11-04 08:35 UTC resubmit (user OK): activeDeadlineSeconds 12 h -> 36 h; the deadline counts from Job creation, so
# 12 h would have killed pods that start late in a long queue (still Pending after ~11.5 h).
# RUN.md step 9 (pilot rollouts) and step 11 (evaluation), pre-approved. Written mid-run: render per use (fill every
# __PLACEHOLDER__ from measured use; jobs/rendered/), checklist in RUN.md "Manifests written during the run".
# Indexed: pod i takes item i of pilot2-dinov3-s0@0/1 pilot2-dinov3+c-radiov4-s0@0/1 ("<run dir name>@<shard i>/<n>", space-separated): one checkpoint, one
# shard of its jobs (subset episodes x eval seeds 41-43, plus clean trials). Each pod writes its own JSONL
# (/mnt/proxy/rollouts/pilot-rollout2/<run>.<i>of<n>.jsonl: one writer per file on CephFS) and resumes from it on retry.
# GPU floor (RUN.md "Rollouts and the 40% GPU floor"): 4 simulator processes per pod batch their inference on
# the GPU; MuJoCo renders on the GPU through NVIDIA EGL (graphics capability requested below).
# Follows _standards/08: Job, real command that exits, no sleep, 1 GPU per pod, limits within 20%, no tolerations.
apiVersion: batch/v1
kind: Job
metadata:
  name: stacking-encoders-proxy-pilot-rollout2
  namespace: aria-world
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 4
  activeDeadlineSeconds: 129600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-GeForce-RTX-3090, NVIDIA-GeForce-RTX-4090, NVIDIA-RTX-A5000, NVIDIA-RTX-A6000, NVIDIA-L40, NVIDIA-L40S, NVIDIA-A10, NVIDIA-L4, NVIDIA-A40]
              - {key: nvidia.com/cuda.driver.major, operator: Gt, values: ["569"]}
              - {key: topology.kubernetes.io/region, operator: In, values: [us-west]}
              - {key: kubernetes.io/hostname, operator: NotIn, values: [k8s-chase-ci-07.calit2.optiputer.net, ry-gpu-08.sdsc.optiputer.net]}  # GPU faults, 2026-11-03
      containers:
      - name: main
        image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          R=/mnt/proxy; I=$JOB_COMPLETION_INDEX
          IT=($ITEMS); RUN=${IT[$I]%%@*}; SH=${IT[$I]##*@}
          OUT=$R/rollouts/pilot-rollout2/$RUN.${SH/\//of}.jsonl
          mkdir -p $R/logs $R/rollouts/pilot-rollout2
          exec > >(tee -a $R/logs/pilot-rollout2-$RUN-${SH/\//of}-$(date +%Y%m%d-%H%M%S).log) 2>&1
          echo "=== index $I: $RUN shard $SH -> $OUT"; nvidia-smi; nproc; date -u
          . /src/env_bundle.sh restore    # prebuilt venv + debs from the env-build Job (LOG 2026-11-03 (d)); assets unzip
          nvidia-smi --query-gpu=timestamp,utilization.gpu,memory.used --format=csv -l 30 > /work/gpu.csv & SMI=$!
          python /src/rollout.py run --run-dir $R/runs/$RUN --t5 $R/feats/t5 \
            --vae-path $R/models/Wan2.2_VAE.safetensors --tasks $R/lp_tasks.json --subset /src/pilot-subset.json --clean 1 \
            --envs 4 --cuda-graph --shard $SH --out $OUT 2>&1 | sed "/using task orders/d"
          kill $SMI || true
          echo "=== GPU utilization over the run (nvidia-smi, 30 s samples)"
          awk -F, 'NR>1 {gsub(/ %/,"",$2); s+=$2; n++} END {if (n) printf "mean %.1f%% over %d samples\n", s/n, n}' /work/gpu.csv
          wc -l $OUT; date -u; echo "=== done"
        env:
        - {name: SRC_GIT_COMMIT, value: dbbc71d241e5b52fa88b072caae6e46cd1482987}
        - {name: ITEMS, value: "pilot2-dinov3-s0@0/1 pilot2-dinov3+c-radiov4-s0@0/1"}
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef: {name: stacking-encoders-hf, key: HF_TOKEN}
        - {name: HF_HOME, value: /work/hf}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: PYTHONPATH, value: /src}
        - {name: SIM_DIR, value: /work/sim}
        - {name: MUJOCO_GL, value: egl}
        - {name: PYOPENGL_PLATFORM, value: egl}
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility,graphics"}
        resources:                    # from measured use (pilot rollout Prometheus); limits <= 1.2x requests
          requests: {cpu: "4", memory: 20Gi, nvidia.com/gpu: "1", ephemeral-storage: 50Gi}
          limits:   {cpu: "4800m", memory: 24Gi, nvidia.com/gpu: "1", ephemeral-storage: 58Gi}
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: src, mountPath: /src, readOnly: true}
        - {name: proxy, mountPath: /mnt/proxy}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: work
        emptyDir: {sizeLimit: 58Gi}   # pip, HF encoder cache, LIBERO-Plus + unzipped assets
      - name: src
        configMap: {name: stacking-encoders-proxy-src}
      - name: proxy
        persistentVolumeClaim: {claimName: stacking-encoders-proxy}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 4Gi}
