# Policy-call profile, run 2 (user OK 2026-11-03: "yeah go for it"; LOG 2026-11-03 (d)/(e)). Same as run 1
# (job-profile-policy.yaml) with the fixes: start noise drawn once per eval seed on the GPU, torch threads = pod CPU quota,
# and --cuda-graph (denoising loop replayed from CUDA graphs), plus a graph-vs-eager check of the executed action chunks.
# First runs test_rollout.py in the pod (synthetic, CPU; user prefers no local runs).
# Run 1 on an RTX 4090 took 18 min; estimate ~25 min (graph captures per batch size); deadline 8 h incl. expected queue.
# Try 1 (07:24 UTC) never ran: both pods rejected at admission on k8s-chase-ci-07 ("GPU is lost"); node excluded.
# Follows _standards/08: Job, real command that exits, no sleep, 1 GPU, no tolerations, us-west, limits <= 1.2x requests.
apiVersion: batch/v1
kind: Job
metadata:
  name: stacking-encoders-proxy-profile-policy2
  namespace: aria-world
spec:
  completions: 1
  backoffLimit: 4                 # admission errors count (memory: give single-pod Jobs >= 3)
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-GeForce-RTX-3090, NVIDIA-GeForce-RTX-4090, NVIDIA-RTX-A5000, NVIDIA-RTX-A6000, NVIDIA-L40, NVIDIA-L40S]
              - {key: nvidia.com/cuda.driver.major, operator: Gt, values: ["569"]}
              - {key: topology.kubernetes.io/region, operator: In, values: [us-west]}
              - {key: kubernetes.io/hostname, operator: NotIn, values: [k8s-chase-ci-07.calit2.optiputer.net]}  # GPU lost, 2026-11-03
      containers:
      - name: main
        image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          R=/mnt/proxy; mkdir -p $R/logs $R/profile
          exec > >(tee -a $R/logs/profile-policy2-$(date +%Y%m%d-%H%M%S).log) 2>&1
          nvidia-smi; nproc; date -u
          bash /src/setup_env.sh > /work/pip-env.log 2>&1 || { tail -50 /work/pip-env.log; exit 1; }
          date -u
          (cd /src && python test_rollout.py)
          nvidia-smi --query-gpu=timestamp,utilization.gpu,memory.used --format=csv -l 30 > /work/gpu.csv & SMI=$!
          python /src/profile_policy.py --runs $R/runs/pilot2-dinov3-s0 $R/runs/pilot2-dinov3+c-radiov4-s0 \
            --t5 $R/feats/t5 --vae-path $R/models/Wan2.2_VAE.safetensors --tasks $R/lp_tasks.json \
            --batches 1 2 4 8 16 32 --cuda-graph --out $R/profile/policy2-$(date +%Y%m%d-%H%M%S).json
          kill $SMI || true
          echo "=== GPU utilization over the profile (nvidia-smi, 30 s samples)"
          awk -F, 'NR>1 {gsub(/ %/,"",$2); s+=$2; n++} END {if (n) printf "mean %.1f%% over %d samples\n", s/n, n}' /work/gpu.csv
          date -u; echo "=== done"
        env:
        - {name: SRC_GIT_COMMIT, value: dbbc71d241e5b52fa88b072caae6e46cd1482987}
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef: {name: stacking-encoders-hf, key: HF_TOKEN}
        - {name: HF_HOME, value: /work/hf}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: PYTHONPATH, value: /src}
        resources:
          requests: {cpu: "4", memory: 14Gi, nvidia.com/gpu: "1", ephemeral-storage: 20Gi}
          limits:   {cpu: "4800m", memory: 16Gi, nvidia.com/gpu: "1", ephemeral-storage: 24Gi}
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: src, mountPath: /src, readOnly: true}
        - {name: proxy, mountPath: /mnt/proxy}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: work
        emptyDir: {sizeLimit: 24Gi}
      - name: src
        configMap: {name: stacking-encoders-proxy-src}
      - name: proxy
        persistentVolumeClaim: {claimName: stacking-encoders-proxy}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 2Gi}
