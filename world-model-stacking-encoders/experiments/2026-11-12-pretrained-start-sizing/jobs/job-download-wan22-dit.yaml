# Downloads the whole Wan 2.2 TI2V-5B video transformer (DiT) from Hugging Face (Wan-AI/Wan2.2-TI2V-5B, not gated,
# no token) onto PVC stacking-encoders-proxy (/mnt/proxy), pinned to revision 921dbaf3f1674a56f47e83fb80a34bac8a8f203e:
#   /mnt/proxy/models/Wan-AI/Wan2.2-TI2V-5B/  (the layout Fast-WAM's loader looks for, step2-reading.md)
#     diffusion_pytorch_model-0000{1,2,3}-of-00003.safetensors (9.83 + 10.00 + 0.18 GB, about 20.0 GB total),
#     diffusion_pytorch_model.safetensors.index.json, config.json, manifest.json
# Shards are checked for byte size and sha256 against the values HF publishes; mismatch fails the Job (bad file deleted).
# The two small files have no published sha256: theirs is computed and printed. Rerun skips files already correct.
# Prints df -h /mnt/proxy first and exits non-zero if under 30 GB free.
# Follows _standards/08: Job, real command that exits, no sleep, no GPU, off GPU nodes, us-west, limits within 20%.
apiVersion: batch/v1
kind: Job
metadata:
  name: stacking-encoders-wan22-dit-download
  namespace: aria-world
spec:
  backoffLimit: 1                     # rerun skips files already complete (size + sha256 check)
  activeDeadlineSeconds: 10800        # 3 h cap
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: feature.node.kubernetes.io/pci-10de.present, operator: NotIn, values: ["true"]}
              - {key: topology.kubernetes.io/region, operator: In, values: [us-west]}
      containers:
      - name: main
        image: python:3.11.14-slim
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          R=/mnt/proxy; D=$R/models/Wan-AI/Wan2.2-TI2V-5B; mkdir -p $R/logs $D
          exec > >(tee -a $R/logs/download-wan22-dit-$(date +%Y%m%d-%H%M%S).log) 2>&1
          date -u; df -h /mnt/proxy
          FREE=$(df --output=avail -B1 /mnt/proxy | tail -1)
          if [ "$FREE" -lt 30000000000 ]; then echo "FAIL: only $FREE bytes free on /mnt/proxy, need 30 GB"; exit 1; fi
          pip install --no-cache-dir -q huggingface-hub==0.36.2
          python - <<'PY'
          import hashlib, json, os
          from huggingface_hub import hf_hub_download
          REPO = "Wan-AI/Wan2.2-TI2V-5B"
          REV = "921dbaf3f1674a56f47e83fb80a34bac8a8f203e"
          D = "/mnt/proxy/models/Wan-AI/Wan2.2-TI2V-5B"
          # name -> (bytes, sha256) as published by HF for this revision; None = not published, compute and print
          FILES = {
              "diffusion_pytorch_model-00001-of-00003.safetensors": (9825014472, "720b06c4ade5e87c1246bba8ac95b664c638749cd9b102cf84d823bb44c026a1"),
              "diffusion_pytorch_model-00002-of-00003.safetensors": (9995661736, "09ec5ef720d8396f6cfa51fbdcbdb2327e37722afd6e89fd38f1e7e5e782c283"),
              "diffusion_pytorch_model-00003-of-00003.safetensors": (178558176, "6306f7894c345de9093ad588771c2abfaeb668a81f7a6d9a918bd26ba3568e49"),
              "diffusion_pytorch_model.safetensors.index.json": None,
              "config.json": None,
          }
          def sha(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for b in iter(lambda: f.read(8 << 20), b""):
                      h.update(b)
              return h.hexdigest()
          def ok(p, exp):
              return exp is not None and os.path.isfile(p) and os.path.getsize(p) == exp[0] and sha(p) == exp[1]
          out = []
          for name, exp in FILES.items():
              p = f"{D}/{name}"
              if ok(p, exp):
                  print("have", name, flush=True)
              else:
                  print("downloading", name, flush=True)
                  hf_hub_download(REPO, name, revision=REV, local_dir=D)
                  if exp is not None:
                      size, h = os.path.getsize(p), sha(p)
                      if size != exp[0] or h != exp[1]:
                          os.remove(p)
                          raise SystemExit(f"FAIL {name}: bytes {size} (want {exp[0]}), sha256 {h} (want {exp[1]})")
              size, h = os.path.getsize(p), sha(p)
              print("ok", name, size, h, "(computed, no published sha256)" if exp is None else "(matches published)", flush=True)
              out.append({"name": name, "bytes": size, "sha256": h})
          man = {"repo_id": REPO, "revision": REV, "files": out}
          with open(f"{D}/manifest.json", "w") as f:
              json.dump(man, f, indent=2)
          print(json.dumps(man, indent=2))
          PY
          ls -la $D; df -h /mnt/proxy; date -u; echo "=== done"
        env:
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: HF_HOME, value: /work/hf}
        # Network-bound and may run > 30 min, so requests stay within NRP's exempt size (1 CPU core, 2GB memory)
        # to avoid low-utilization flags; same sizing as the proxy download Job (limits within 20% of requests).
        resources:
          requests: {cpu: "1", memory: 1536Mi, ephemeral-storage: 8Gi}
          limits:   {cpu: "1200m", memory: 1800Mi, ephemeral-storage: 9Gi}
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: proxy, mountPath: /mnt/proxy}
      volumes:
      - name: work
        emptyDir: {sizeLimit: 9Gi}
      - name: proxy
        persistentVolumeClaim: {claimName: stacking-encoders-proxy}
