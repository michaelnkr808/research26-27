# PREPARED, NOT SUBMITTED (the lead says when). Validation check, PLAN Q2 / Handoff step 2: is the DINOv3 probe's val R2 the same on the
# stored clean val frames and on clean val frames re-rendered through our pipeline (|difference| <= 0.01, combined; per camera reported)?
# No test demo anywhere (the test demos' model_file, actions, features and frames are never read).
# Approval, verbatim (this session, 2026-11-08 about 00:15 UTC): "Approve phase 1 (Recommended)", whose text was: "Counts as your go for both
# short cluster jobs: the smoke test, then the validation check if the smoke test passes. The analysis-code worker starts now." Plus the
# user's 2026-11-08 05:40 UTC decision "Find the cause, then check (Recommended)" (Job A, stacking-encoders-pf-diag, first). The lead sets
# the go for this Job B.
# What it does, in one pod, 1 GPU (2 CPU / 12Gi, the broad card list, 12 h deadline, as the smoke test r3):
#   1. restore the eval environment, download the 10 libero_goal HDF5 files from Hugging Face at the pinned commit f13aa24a (the commit of the
#      file the smoke test used; the tally downloaded `main`; sha256 of every file is printed);
#   2. pf_validate.py render: for each file, the clean VAL demos only (diagnostics.demo_split over the tally's demo list = all demos, asserted
#      against the dinov3 cache's demo names), Q20 check, fixture copy (list from the file's model_file differences over train+val demos),
#      set_init_state(states[j+1]), render 256, area shrink to 128, written as LIBERO-layout files in /work/render/libero_goal/<stem>.hdf5
#      (raw OpenGL orientation, n-1 frames per demo; PLAN amendment 2026-11-08 input contract);
#   3. DINOv3 extraction of those frames with the unchanged src/extract_features.py from the proxy-src ConfigMap (--dtype float32, 224,
#      rotate180, grid 4, frame_stride 1, both cameras = the tally's call), with transformers 5.18.0 / tokenizers 0.23.3 / huggingface-hub 2.2.0
#      installed into a separate folder (the tally's pins) so the encoder code path matches the tally's; the model revision is checked against
#      ea8dc28 (README data table);
#   4. pf_validate.py probe: meta of the new feature files must equal the clean cache's on encoder, hf_id, resolution, rotate180, dtype, grid,
#      frame_stride, cams (pf_analysis.check_meta; any mismatch fails); probe fit on the clean stored TRAIN features with the tally's alpha for
#      dinov3|global; val R2 on stored vs re-rendered val frames, both on the same n-1 frames per demo; per camera and combined; lag check;
#      the stored val R2 on all val frames at that alpha is compared with the tally JSON's value as a pipeline check.
# GPU time estimate (speculative, nothing like it was timed): about 8.5 min restore (measured in the smoke test), download a few min, render
# about 100 val demos x about 90 frames x 2 cameras (est. 10 to 20 min), DINOv3 on about 18,000 frames (est. 5 to 10 min), probe a few min:
# well under 1 h total, so under NRP's 3 h flag. GPU utilization will be low for the restore and render parts, as in the smoke test.
# NEW code through a NEW ConfigMap stacking-encoders-pf-val-src (NOT created yet), created with:
#   kubectl create configmap stacking-encoders-pf-val-src -n aria-world --request-timeout=30s --from-file=pf_render.py=<repo>/world-model-stacking-encoders/src/pf_render.py --from-file=pf_smoke.py=<repo>/world-model-stacking-encoders/src/pf_smoke.py --from-file=pf_analysis.py=<repo>/world-model-stacking-encoders/src/pf_analysis.py --from-file=pf_validate.py=<repo>/world-model-stacking-encoders/src/pf_validate.py --from-file=<repo>/world-model-stacking-encoders/experiments/2026-10-19-feasibility-tally/results/tally-libero_goal-dinov3-c-radiov4.json --from-file=<repo>/world-model-stacking-encoders/experiments/2026-10-19-feasibility-tally/results/tally-libero_goal-dinov3-sam3.json --from-file=<repo>/world-model-stacking-encoders/experiments/2026-10-19-feasibility-tally/results/tally-libero_goal-dinov3-siglip2.json --from-file=<repo>/world-model-stacking-encoders/experiments/2026-10-19-feasibility-tally/results/tally-libero_goal-dinov3-vggt-omega.json
# Outputs: PVC stacking-encoders-proxy /mnt/proxy/pf-val/<stamp>/ (reports) and a small base64 tarball at the end of the pod log between the
# markers PF_VAL_TGZ_B64 (reports only; the rendered frames stay in the pod). Follows _standards/08: Job, real command that exits, no sleep,
# no tolerations, 1 GPU, limits within 20% of requests, backoffLimit 0, ttl 86400.
apiVersion: batch/v1
kind: Job
metadata:
  name: stacking-encoders-pf-val
  namespace: aria-world
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-GeForce-RTX-3090, NVIDIA-GeForce-RTX-4090, NVIDIA-RTX-A5000, NVIDIA-L40, NVIDIA-L40S, NVIDIA-A10, NVIDIA-L4]
              - {key: nvidia.com/cuda.driver.major, operator: Gt, values: ["569"]}
              - {key: topology.kubernetes.io/region, operator: In, values: [us-west]}
              - {key: kubernetes.io/hostname, operator: NotIn, values: [k8s-chase-ci-07.calit2.optiputer.net, ry-gpu-08.sdsc.optiputer.net]}  # GPU faults, 2026-11-03
      containers:
      - name: main
        image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          R=/mnt/proxy; STAMP=$(date +%Y%m%d-%H%M%S); OUT=/work/out; mkdir -p $R/logs $OUT /work/data /work/render /work/feats_rr
          exec > >(tee -a $R/logs/pf-val-$STAMP.log) 2>&1
          echo "=== pf-val $STAMP"; nvidia-smi -L; nproc; date -u
          . /src/env_bundle.sh restore    # prebuilt venv + debs from the env-build Job; LIBERO-Plus assets unzip
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("yifengzhu-hf/LIBERO-datasets", repo_type="dataset", revision="f13aa24a3da8c43c7225569f28c562979fa0e35a",
                            allow_patterns=["libero_goal/*.hdf5"], local_dir="/work/data")
          PY
          ls -la /work/data/libero_goal; sha256sum /work/data/libero_goal/*.hdf5; date -u
          set +e
          python /pf/pf_validate.py render --raw /work/data/libero_goal --out /work/render
          RC1=$?
          echo "=== render exit code $RC1"; date -u
          RC2=99; RC3=99
          if [ $RC1 -eq 0 ]; then
            pip install --no-cache-dir -q --target /work/extlib transformers==5.18.0 tokenizers==0.23.3 safetensors==0.8.0 huggingface-hub==2.2.0 einops==0.8.1
            PYTHONPATH=/work/extlib:$PYTHONPATH python - <<'PY'
          import transformers, huggingface_hub
          from huggingface_hub import HfApi
          print("transformers", transformers.__version__, "huggingface_hub", huggingface_hub.__version__)
          sha = HfApi().model_info("facebook/dinov3-vitl16-pretrain-lvd1689m").sha
          print("dinov3 model sha", sha, "expected prefix ea8dc28:", sha.startswith("ea8dc28"))
          PY
            sha256sum /src/extract_features.py
            PYTHONPATH=/work/extlib:$PYTHONPATH python /src/extract_features.py --encoder dinov3 --dtype float32 --batch-size 64 \
              --out /work/feats_rr --hdf5 /work/render/libero_goal/*.hdf5
            RC2=$?
            echo "=== extract exit code $RC2"; date -u
            if [ $RC2 -eq 0 ]; then
              python /pf/pf_validate.py probe --raw /work/data/libero_goal --out $OUT
              RC3=$?
              echo "=== probe exit code $RC3"
            fi
          fi
          set -e
          cp /work/render/render-report.json $OUT/ || true
          cp /work/render/render-crash.txt $OUT/ || true
          echo "=== exit codes render $RC1 extract $RC2 probe $RC3"; ls -la $OUT; date -u
          mkdir -p $R/pf-val/$STAMP
          cp -r $OUT/. $R/pf-val/$STAMP/
          echo "copied to $R/pf-val/$STAMP"
          tar czf /work/pf-val.tgz -C $OUT .
          ls -la /work/pf-val.tgz
          echo "=== BEGIN PF_VAL_TGZ_B64"; base64 -w 76 /work/pf-val.tgz; echo "=== END PF_VAL_TGZ_B64"
          echo "=== done"
        env:
        - {name: SRC_GIT_COMMIT, value: 8b23b9a3a52f97de0081b90d311491c177373f70}
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef: {name: stacking-encoders-hf, key: HF_TOKEN}
        - {name: HF_HOME, value: /work/hf}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: PYTHONPATH, value: "/pf:/src"}
        - {name: SIM_DIR, value: /work/sim}
        - {name: MUJOCO_GL, value: egl}
        - {name: PYOPENGL_PLATFORM, value: egl}
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility,graphics"}
        resources:                    # as the smoke test r3 (user, 2026-11-08): 2 CPU / 12Gi request, limits <= 1.2x requests
          requests: {cpu: "2", memory: 12Gi, nvidia.com/gpu: "1", ephemeral-storage: 50Gi}
          limits:   {cpu: "2400m", memory: 14Gi, nvidia.com/gpu: "1", ephemeral-storage: 58Gi}
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: src, mountPath: /src, readOnly: true}
        - {name: pf, mountPath: /pf, readOnly: true}
        - {name: proxy, mountPath: /mnt/proxy}
        - {name: features, mountPath: /mnt/features, readOnly: true}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: work
        emptyDir: {sizeLimit: 58Gi}   # venv, LIBERO-Plus + assets, 6.4 GB of HDF5, re-rendered frames, features
      - name: src
        configMap: {name: stacking-encoders-proxy-src}
      - name: pf
        configMap: {name: stacking-encoders-pf-val-src}
      - name: proxy
        persistentVolumeClaim: {claimName: stacking-encoders-proxy}
      - name: features
        persistentVolumeClaim: {claimName: stacking-encoders-features, readOnly: true}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 4Gi}
