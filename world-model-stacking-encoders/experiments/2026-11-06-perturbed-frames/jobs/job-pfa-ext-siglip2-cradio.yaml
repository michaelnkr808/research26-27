# PHASE A, job 2 of 6 (pfa-ext-siglip2-cradio). NOT SUBMITTED. Submit only after job-pfa-render has finished with exit 0 (the script checks and aborts).
# SigLIP 2 then C-RADIOv4 on the phase-A trainval render. Flags and pins from experiments/2026-10-18-extract-libero-goal/job.yaml (transformers 4.57.6 etc.).
# Features are staged on local disk, then copied to /mnt/proxy/pf-main/phase-a/feats/<enc>/libero_goal/ (never overwritten). Estimate (speculative): about 0.8 GPU-h.
# Resources: RSS of these two encoders was 2.4 GB at 2 CPU in the proxy extraction (proxy LOG 2026-10-29), hence 4Gi, not the 10Gi of the old pilot Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: stacking-encoders-pfa-ext-siglip2-cradio
  namespace: aria-world
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800        # 48 h from creation, queue included (pf-val precedent); the work itself is capped stage by stage inside
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-GeForce-RTX-2080-Ti, NVIDIA-TITAN-RTX, Quadro-RTX-6000, Quadro-RTX-8000, NVIDIA-GeForce-RTX-3090, NVIDIA-GeForce-RTX-4090, NVIDIA-RTX-A4000, NVIDIA-RTX-A5000, NVIDIA-A10, NVIDIA-L4, NVIDIA-L40, NVIDIA-L40S, NVIDIA-RTX-4000-Ada-Generation, NVIDIA-RTX-5000-Ada-Generation]
              - {key: nvidia.com/cuda.driver.major, operator: Gt, values: ["569"]}
              - {key: topology.kubernetes.io/region, operator: In, values: [us-west]}
              - {key: kubernetes.io/hostname, operator: NotIn, values: [k8s-chase-ci-07.calit2.optiputer.net, ry-gpu-08.sdsc.optiputer.net]}  # GPU faults, 2026-11-03
      containers:
      - name: main
        image: pytorch/pytorch@sha256:c16f4c749e2d9e96878875cdf6cc45cddda1d1a36fddd371dd6f2360f1b6e2a2   # pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime, pinned by digest (read from the running eval pods by the lead)
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          case "${SRC_GIT_COMMIT:-}" in FILL*|"") echo "ABORT: SRC_GIT_COMMIT not filled in (render the manifest with sed at submit time, see PHASE-A.md)"; exit 11;; esac
          R=/mnt/proxy; PH=$R/pf-main/phase-a; STAMP=$(date +%Y%m%d-%H%M%S); OUT=/work/out; JOB=pfa-ext-siglip2-cradio
          export PH OUT
          # per-stage caps: every command except the sourced environment restore runs under `timeout <seconds>` (exit 124 on expiry = a failed stage)
          cap() { _s=$1; shift; timeout -k 60 "$_s" "$@"; }
          WORST=0; LAST=0
          stage() { _n=$1; shift; "$@"; LAST=$?; echo "=== $_n exit code $LAST"; date -u; if [ $LAST -gt $WORST ]; then WORST=$LAST; fi; return 0; }
          mkdir -p $R/logs $PH $OUT /work/hf
          exec > >(tee -a $R/logs/$JOB-$STAMP.log) 2>&1
          echo "=== $JOB $STAMP src $SRC_GIT_COMMIT"; nvidia-smi -L; nproc; date -u; df -h /mnt/proxy | tail -1
          FREE_GB=$(df -BG --output=avail /mnt/proxy | tail -1 | tr -dc 0-9)
          if [ "$FREE_GB" -lt 100 ]; then echo "ABORT: only ${FREE_GB}G free on the proxy PVC, need >= 100G (expected use about 30G)"; exit 12; fi
          [ -f $PH/render/RENDER_COMPLETE ] || { echo "ABORT: $PH/render/RENDER_COMPLETE missing: submit this Job only after job-pfa-render has finished with exit 0"; exit 20; }
          EXT_OK=1
          for s in $(ls $PH/render/libero_goal/ | sed s/.hdf5$//); do [ ! -e $PH/feats/siglip2/libero_goal/$s.h5 ] || { echo "ABORT: $PH/feats/siglip2/libero_goal/$s.h5 already exists (never overwritten)"; exit 22; }; done
          for s in $(ls $PH/render/libero_goal/ | sed s/.hdf5$//); do [ ! -e $PH/feats/c-radiov4/libero_goal/$s.h5 ] || { echo "ABORT: $PH/feats/c-radiov4/libero_goal/$s.h5 already exists (never overwritten)"; exit 22; }; done
          cap 1800 pip install --no-cache-dir -q torch==2.7.1 torchvision==0.22.1 \
            transformers==4.57.6 tokenizers==0.22.2 safetensors==0.8.0 huggingface-hub==0.36.2 \
            timm==1.0.30 einops==0.8.1 open-clip-torch==3.3.0 ftfy==6.3.1 regex==2026.9.29 \
            h5py==3.16.0 numpy==2.2.6 pillow==13.0.0
          cap 300 python - <<'PY' || echo "(revision print failed; not gating)"
          from huggingface_hub import HfApi
          for r in ["google/siglip2-large-patch16-384", "nvidia/C-RADIOv4-SO400M"]:
              print("revision", r, HfApi().model_info(r).sha)
          PY
          STEMS_ALL=$(ls $PH/render/libero_goal/ | sed s/.hdf5$//)
          # --- inputs: the phase-A render published by job pfa-render (fail fast if it is not there or not intact)
          [ -f $PH/render/RENDER_COMPLETE ] || { echo "ABORT: $PH/render/RENDER_COMPLETE missing: submit this Job only after job-pfa-render has finished with exit 0"; exit 20; }
          [ -f $PH/render/render-sha256.txt ] || { echo "ABORT: no render-sha256.txt"; exit 20; }
          EXT=$(sha256sum /src/extract_features.py | cut -c1-12)
          [ "$EXT" = "03734ba84a86" ] || { echo "ABORT: /src/extract_features.py sha256 prefix is $EXT, expected 03734ba84a86 (the tally/pf-val extractor)"; exit 21; }
          STEMS="$STEMS_ALL"
          mkdir -p /work/pfa-trainval/libero_goal
          : > /work/sha-mine.txt
          for s in $STEMS; do
            [ -f $PH/render/libero_goal/$s.hdf5 ] || { echo "ABORT: $PH/render/libero_goal/$s.hdf5 missing"; exit 20; }
            grep "  $s.hdf5\$" $PH/render/render-sha256.txt >> /work/sha-mine.txt
            cp $PH/render/libero_goal/$s.hdf5 /work/pfa-trainval/libero_goal/$s.hdf5
          done
          [ $(wc -l < /work/sha-mine.txt) -eq 10 ] || { echo "ABORT: hash lines do not match the file count"; exit 20; }
          (cd /work/pfa-trainval/libero_goal && sha256sum -c /work/sha-mine.txt)
          ls -la /work/pfa-trainval/libero_goal; date -u
          python -c "import transformers, numpy; print('transformers', transformers.__version__, 'numpy', numpy.__version__)"
          set +e
          mkdir -p /work/feats
          copy_feats() {  # copy_feats <encoder>: local /work/feats/<enc>/libero_goal/*.h5 -> PVC, one file at a time through .partial; never overwrites
            set -e
            _d=$PH/feats/$1/libero_goal; mkdir -p $_d
            for _f in /work/feats/$1/libero_goal/*.h5; do
              _b=$(basename $_f)
              if [ -e $_d/$_b ]; then echo "REFUSE: $_d/$_b already exists"; exit 1; fi
              cp $_f $_d/$_b.partial
              mv $_d/$_b.partial $_d/$_b
            done
            ls -la $_d
          }
          export -f copy_feats
          stage extract-siglip2 cap 7200 python /src/extract_features.py --encoder siglip2 --variant google/siglip2-large-patch16-384 --dtype float16 --batch-size 64 --out /work/feats --hdf5 /work/pfa-trainval/libero_goal/*.hdf5
          EXT_OK=$LAST
          if [ $EXT_OK -eq 0 ]; then
            stage meta-siglip2 cap 900 python - siglip2 10 <<'PY'
          import glob, json, sys
          sys.path[:0] = ["/pf", "/src"]
          import h5py
          import pf_analysis as A
          enc = sys.argv[1]; expect = int(sys.argv[2])
          ref = A.load_reference_meta("/pf/smoke-report.json", [enc])[enc]
          files = sorted(glob.glob(f"/work/feats/{enc}/libero_goal/*.h5"))
          assert len(files) == expect, (len(files), expect)
          for p in files:
              with h5py.File(p, "r") as f:
                  A.check_meta(f, ref, p)
                  m = json.loads(f.attrs["meta"])
                  stem = p.rsplit("/", 1)[1][:-3]
                  assert m["source_file"] == f"/work/pfa-trainval/libero_goal/{stem}.hdf5", m["source_file"]
                  assert m["n_demos"] == 40, m["n_demos"]
                  assert sum(1 for k in f.keys() if k.startswith("demo_")) == 40
          print("meta ok:", enc, len(files), "files; checked keys", A.META_KEYS)
          PY
            if [ $LAST -eq 0 ]; then stage copy-siglip2 cap 3600 bash -c 'copy_feats "$@"' _ siglip2; fi
          fi
          stage extract-c-radiov4 cap 10800 python /src/extract_features.py --encoder c-radiov4 --dtype float16 --batch-size 64 --out /work/feats --hdf5 /work/pfa-trainval/libero_goal/*.hdf5
          EXT_OK=$LAST
          if [ $EXT_OK -eq 0 ]; then
            stage meta-c-radiov4 cap 900 python - c-radiov4 10 <<'PY'
          import glob, json, sys
          sys.path[:0] = ["/pf", "/src"]
          import h5py
          import pf_analysis as A
          enc = sys.argv[1]; expect = int(sys.argv[2])
          ref = A.load_reference_meta("/pf/smoke-report.json", [enc])[enc]
          files = sorted(glob.glob(f"/work/feats/{enc}/libero_goal/*.h5"))
          assert len(files) == expect, (len(files), expect)
          for p in files:
              with h5py.File(p, "r") as f:
                  A.check_meta(f, ref, p)
                  m = json.loads(f.attrs["meta"])
                  stem = p.rsplit("/", 1)[1][:-3]
                  assert m["source_file"] == f"/work/pfa-trainval/libero_goal/{stem}.hdf5", m["source_file"]
                  assert m["n_demos"] == 40, m["n_demos"]
                  assert sum(1 for k in f.keys() if k.startswith("demo_")) == 40
          print("meta ok:", enc, len(files), "files; checked keys", A.META_KEYS)
          PY
            if [ $LAST -eq 0 ]; then stage copy-c-radiov4 cap 3600 bash -c 'copy_feats "$@"' _ c-radiov4; fi
          fi
          echo "=== exit codes: worst $WORST"; date -u
          REP=$PH/reports/$JOB-$STAMP
          mkdir -p $REP && cp -r $OUT/. $REP/ && echo "copied reports to $REP" || { echo "REPORT COPY FAILED"; if [ $WORST -eq 0 ]; then WORST=15; fi; }
          (cd $OUT && tar czf /work/$JOB.tgz .)
          ls -la /work/$JOB.tgz
          if [ $(du -k /work/$JOB.tgz | cut -f1) -lt 2048 ]; then echo "=== BEGIN PFA_TGZ_B64"; base64 -w 76 /work/$JOB.tgz; echo "=== END PFA_TGZ_B64"; fi
          echo "=== done; exiting with $WORST (0 only if every stage passed)"
          exit $WORST
        env:
        - {name: SRC_GIT_COMMIT, value: FILL_AT_SUBMIT}   # sed at submit time (PHASE-A.md); the script aborts if it is still FILL_AT_SUBMIT
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef: {name: stacking-encoders-hf, key: HF_TOKEN}
        - {name: HF_HOME, value: /work/hf}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: PYTHONPATH, value: "/pf:/src"}
        resources:
          requests: {cpu: "2", memory: 4Gi, nvidia.com/gpu: "1", ephemeral-storage: 24Gi}
          limits:   {cpu: "2400m", memory: 4800Mi, nvidia.com/gpu: "1", ephemeral-storage: 28Gi}
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: src, mountPath: /src, readOnly: true}
        - {name: pf, mountPath: /pf, readOnly: true}
        - {name: proxy, mountPath: /mnt/proxy}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: work
        emptyDir: {sizeLimit: 28Gi}
      - name: src
        configMap: {name: stacking-encoders-proxy-src}
      - name: pf
        configMap: {name: stacking-encoders-pf-main-src}
      - name: proxy
        persistentVolumeClaim: {claimName: stacking-encoders-proxy}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 4Gi}
